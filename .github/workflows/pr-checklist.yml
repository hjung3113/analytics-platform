name: PR checklist

# AGENTS.md "작업 관리": 이슈 연결과 확정 시 체크(공통화 판단·문서 갱신·로드맵·UI 프로토타입)를 모든 에이전트 PR에 강제한다.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-checklist:
    name: PR checklist
    runs-on: ubuntu-latest
    steps:
      - name: Check issue link and checklist
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          if ! printf '%s' "$BODY" | grep -Eiq '(closes|fixes|resolves|refs) #[0-9]+'; then
            echo "::error::PR 본문에 'Closes #n' 또는 'Refs #n' 이슈 연결이 없습니다 (AGENTS.md 작업 관리)."; fail=1
          fi
          for item in '공통화 판단' '문서 갱신' '로드맵 갱신' 'UI 변경이면 컨펌된 프로토타입'; do
            if ! printf '%s' "$BODY" | grep -Eq "^\s*- \[[xX]\] ${item}"; then
              echo "::error::체크 항목 '${item}'이 체크되지 않았습니다. 내용을 적고 [x]로 표시하세요."; fail=1
            fi
          done
          exit $fail
