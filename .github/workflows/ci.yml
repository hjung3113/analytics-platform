name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 경로 필터 없이 매 push/PR마다 4개 Job을 모두 실행한다(레포가 작아 단순함 우선).
# 체크아웃은 모두 submodules: false — 세 프로토타입 어느 것도 products/feedbackops를 런타임에 참조하지 않으므로(이식이지 참조가 아님) 서브모듈을 초기화하지 않는다.

jobs:
  python-codec:
    name: Python codec (kernel-context-url-scope)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-context-url-scope
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          # README: "Python 3.9+ standard library only ... Verified locally with Python 3.9.6"
          python-version: '3.9'
      - run: python -m pip install pytest==8.4.2
      - run: python3 -m pytest test_context_url.py -q

  unit-a-app-shell:
    name: Unit A (kernel-app-shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-app-shell
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README: "설치된 Node 26.7.0 / npm 11.19.0으로 검증했다"
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: prototypes/kernel-app-shell/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  unit-b-chart-frame:
    name: Unit B (kernel-chart-frame)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-chart-frame
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README에 Node 버전 명시 없음 → Active LTS
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/kernel-chart-frame/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  unit-c-platform-table:
    name: Unit C (kernel-platform-table)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-platform-table
    env:
      # playwright.config.ts는 PLAYWRIGHT_BROWSERS_PATH ||= resolve('.browsers')를 설정하지만
      # `playwright install`은 config를 읽지 않아 기본 ~/.cache/ms-playwright에 설치한다.
      # install/run 양쪽이 같은 .browsers 경로를 쓰도록 Job 전체에 명시한다(README의 설치 커맨드와 동일).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/prototypes/kernel-platform-table/.browsers
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README에 Node 버전 명시 없음 → Active LTS
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/kernel-platform-table/package-lock.json
      - run: npm ci
      # package.json에 typecheck 스크립트가 없고 build가 `tsc --noEmit && vite build`로 타입 검사를 포함한다.
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Verify Chromium landed in PLAYWRIGHT_BROWSERS_PATH
        run: ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*
      - run: npm run test:browser
      - run: npm run build
