name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Release gate (#1019): the only run that is cold and whole. `gh workflow run ci.yml -f full=true` before the release tag.
  workflow_dispatch:
    inputs:
      full:
        description: 'Run everything cold: no turbo cache restore, turbo --force (release gate)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A manual run has its own group so it never cancels, or is cancelled by, the push/PR run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}
  # Superseded PR runs are cancelled. A running main push or manual run is never cancelled, but GitHub keeps only one pending run per group:
  # when several main pushes queue behind a running one, only the newest waits and the older pending ones end `cancelled` with no jobs (#1884).
  # The newest run checks the whole tree, so a break is not hidden; what is lost is which of the skipped commits broke it (bisect from the last green SHA).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 워크플로 수준 경로 필터는 쓰지 않는다: 필수 검사가 아예 안 뜨면 병합이 Pending으로 막힌다. `changes` Job이 `.github/scripts/classify-changes.mjs`로 Markdown과 `.agents/` 아래만
# 바뀐 PR(#1018, 코드나 시험이 읽는 Markdown `CODE_READS_MD`는 코드로 센다 #1884)을 가려 `code=false`를 내면, 필수 Job 둘(workspace·E2E 병합)은 그대로 돌되 무거운 단계만 건너뛴다(#671 B6, D2). 필수 Job을 Job 수준 `if`로
# 건너뛰면 Success로 보고되어, `changes`가 실패해도 필수 검사가 통과해 버린다 — 그래서 쓰지 않는다. 판정은 fail-safe다: `code`가
# 정확히 'false'일 때만 건너뛰고, `changes`가 실패하면(출력 없음) 전부 돈다.
# workspace 검사(#1019)는 turbo 캐시로 바뀐 패키지와 그 의존자만 다시 돈다(`.turbo/cache`를 main push가 저장하고 PR은 복원만 한다). 전체·cold는 `full`일 때뿐이다(바뀐 패키지가 많은 보통 PR은 20분대까지 걸릴 수 있고, 서버 시험은 `Platform test`가 아니라 `integration`이 한 번만 돈다):
# `workflow_dispatch`의 `full=true`(릴리스 태그 전 수동), 또는 `changes`가 판단하지 못해 `full`이 'false'가 아닐 때(출력 없음 포함) → 캐시를 복원하지 않고 `TURBO_FORCE=true`.
# `Platform workspace (pnpm monorepo)`는 병렬 Job(Platform static·Platform test 조각 3개, #1680)의 모음 Job이고, 하위 결과가 모두 정확히 success일 때만 통과한다.
# E2E는 shard Job + 병합 Job(#666)이다. PR과 main push는 바뀐 것에 영향받는 spec만 돈다(`.github/scripts/select-e2e.mjs`, #1019): 판단하지 못하면 전부(shard 8개)이고 대부분의 코드 PR이 전부 돈다. `apps/platform-api/**`·`ops/platform-api/**`만 바뀐 PR은 mock E2E가 필요 없다(`ops/platform-api/tsconfig.base.json` 제외, #1680). 전체는 `workflow_dispatch`의
# `full=true`(릴리스 태그 전)에서도 돈다. main push의 기준은 직전 커밋이 아니라 CI가 green이었던 마지막 main SHA다(`last-green-main-sha.mjs`) — 실패한 spec은 green이 될 때까지 범위에 남는다.
# 기능 패키지는 서브모듈이 아니라 일반 디렉터리(apps/{platform-api,feature-screens}·packages/feature-*·docs/{product,design,user-guide}/features·docs/architecture/platform-api)라 checkout 옵션이 따로 없다(기능 게이트도 ci.yml이 소유).

# PR 최소 모드(#1931, 소유자 지시: 운영 전까지 PR CI 벽시계 약 10분, 운영 시점은 소유자가 정한다): 아래 검사는 PR에서 돌지 않고 main push와
# `workflow_dispatch`(릴리스 `full=true` 포함)에서만 돈다 — SDK upgrade gate와 그 self-test, Platform static의 SDK 릴리스 tarball·외부 소비자·키트 검사,
# E2E shard 1의 키트 브라우저 검사, Intro site captures, Backend images. 필수 검사 두 개의 이름과 의미는 그대로다. 옮긴 검사가 깨지면 main push가 먼저 빨개진다.

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` lists the earlier CI runs for the main-push baseline (this job only).
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      site: ${{ steps.classify.outputs.site }}
      full: ${{ steps.classify.outputs.full }}
      e2e: ${{ steps.e2e.outputs.e2e }}
      e2e_base_path: ${{ steps.e2e.outputs.e2e_base_path }}
      e2e_shards: ${{ steps.e2e.outputs.e2e_shards }}
      e2e_total: ${{ steps.e2e.outputs.e2e_total }}
      e2e_kit: ${{ steps.e2e.outputs.e2e_kit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The rules live in the script (with --self-test): code=false only for a PR whose every changed file is Markdown or under .agents/;
      # site=false only for a PR with a non-empty diff that touches nothing the intro-site captures depend on (#608);
      # full=true for a manual full=true run, and for anything the script cannot decide (it then prints code=true site=true full=true).
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FULL_INPUT: ${{ inputs.full }}
        run: node .github/scripts/classify-changes.mjs
      # Push to main only: the last main SHA whose CI run was green (empty when none/unreachable/API error → the E2E selection falls back to all).
      - id: baseline
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/last-green-main-sha.mjs
      # Which E2E specs the change can affect (rules in the script, with --self-test): e2e = all | none | base-path-only | a spec list; unknown anything → all.
      - id: e2e
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASELINE: ${{ steps.baseline.outputs.sha }}
          SHA: ${{ github.sha }}
          FULL_INPUT: ${{ inputs.full }}
        run: node .github/scripts/select-e2e.mjs

  # Lint, typecheck, build and the checks that need the build output (#1019 splits the old single job so `pnpm test` runs beside it).
  platform-static:
    name: Platform static
    needs: changes
    # Runs even when `changes` failed (then every step runs). Never skipped as a whole: the aggregate required check reads its result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 'false' only for a Markdown-only PR; empty (changes failed) or 'true' runs every step.
      FEATURE_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
      # Cold and whole when `full` is 'true' (release gate) or empty (changes failed): the turbo cache is neither restored nor trusted.
      TURBO_FORCE: ${{ needs.changes.outputs.full != 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # pnpm 버전은 루트 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          # Node 버전은 .nvmrc 한 곳에서 읽는다(#1951). 로컬 검증 환경과 같다.
          node-version-file: .nvmrc
          cache: pnpm
      # Relative links and heading anchors in tracked Markdown (CLAUDE.md symlinks and vendored skills excluded); every PR; node builtins only, before install.
      - run: node .github/scripts/check-doc-links.mjs
      # #1977: every platform ADR file is listed in docs/adr/by-topic.md (same pair as `pnpm docs:links`); node builtins only.
      - run: node .github/scripts/check-adr-topics.mjs
      # #1676 (docs/AGENTS.md "ADR numbering"): FeedbackOps ADRs in feature code and guides are cited as `FO ADR-NNNN`, never a bare `ADR-00NN` that reaches a platform ADR; every PR; node builtins only, before install.
      - run: |
          node .github/scripts/check-fo-adr-citations.mjs --self-test
          node .github/scripts/check-fo-adr-citations.mjs
      # #1207 (ADR-0131): the ap-sdk-consumer skill names only exported, menu-importable pieces; every PR, because a PR that only edits .agents/ skips the static steps; node builtins only, before install.
      - run: |
          node .github/scripts/check-sdk-skill-names.mjs --self-test
          node .github/scripts/check-sdk-skill-names.mjs
      - run: pnpm install --frozen-lockfile
        if: ${{ env.DOCS_ONLY != 'true' }}
      # turbo cache (#1019): restored on every non-full run, saved only by a push to main so PR runs cannot grow the cache.
      - uses: actions/cache/restore@v4
        if: ${{ env.DOCS_ONLY != 'true' && env.TURBO_FORCE != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-static-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-static-
      - name: Guard unified root task graphs
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          node .github/scripts/check-platform-turbo-scope.mjs
          node .github/scripts/check-platform-turbo-scope.mjs --self-test
          # #2029: a cached test that reads another package's files must hash them, or a stale cache passes.
          node .github/scripts/check-turbo-cross-reads.mjs
          node .github/scripts/check-turbo-cross-reads.mjs --self-test
          node --test .github/scripts/check-unified-ci.test.mjs
          # #1884: the scripts that decide which gates run are tested here too (node builtins and bash only, seconds).
          node .github/scripts/classify-changes.mjs --self-test
          node .github/scripts/select-e2e.mjs --self-test
          node .github/scripts/last-green-main-sha.mjs --self-test
          bash .github/scripts/e2e-verdict.sh --self-test
          bash .github/scripts/require-success.sh --self-test
          node --test apps/platform-e2e/tests-kit/*.test.mjs
      - run: pnpm lint
        if: ${{ env.DOCS_ONLY != 'true' }}
      - name: Additional feature static gates
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: bash ops/platform-api/scripts/ci/gate.sh static-extra
      - run: pnpm build
        if: ${{ env.DOCS_ONLY != 'true' }}
      # ADR-0067 (#575): the Dockview engine stays a lazy chunk — no start-up chunk of the app contains it.
      - if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          pnpm check:lazy-chunks
          pnpm check:lazy-chunks --self-test
      # #520: snapshot the built declaration surface before sdk:pack clears and rebuilds dist.
      - name: SDK public API snapshots
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          pnpm sdk:api
          pnpm sdk:api --self-test
          pnpm sdk:test
      # #430: verify the packed contracts package in an external consumer.
      - run: pnpm --filter @ap/contracts check:pack
        if: ${{ env.DOCS_ONLY != 'true' }}
      # #519 (ADR-0056): the nine release tarballs, then a clean outside consumer installs them (install, tsc, vite build, CSS classes, vitest).
      - name: SDK release tarballs and outside consumer
        if: ${{ env.DOCS_ONLY != 'true' && github.event_name != 'pull_request' }}
        run: |
          out="$(mktemp -d)"
          pnpm sdk:pack --out "$out"
          pnpm sdk:consumer-check "$out"
          # #1702 §10.5 (ADR-0141 entry condition): every negative check of the out-of-repo assembly, each id failing
          # with its own message (duplicate id, undeclared permission, contract integer, host feature, two kernels,
          # kept stored items, preserved URL key, output scans, offline install).
          node tooling/sdk/sdk-consumer-negatives.mjs "$out"
          # #1790: the start-kit asset built from the same tarballs, then checked unpacked (install, check, build, no .map or
          # external origin, dev first screen, README second-menu steps).
          node tooling/sdk/sdk-kit.mjs --tarballs "$out"
          node tooling/sdk/sdk-kit-check.mjs "$out"
          # #1701: the same asset installed with no network in a linux-x64 container, from a store a connected container built.
          node tooling/sdk/sdk-kit-offline.mjs "$out"
      # #153 (ADR-0009): the production module graph (assembly external) carries no mock-server, menu mock or src/dev
      - run: pnpm --filter @ap/platform-web check:prod-graph
        if: ${{ env.DOCS_ONLY != 'true' }}
      # The checks must still bite (#153 review P3-1): the assembly forced to the mock must fail both the CI graph
      # check and the build-time guard of a real production build. An unexpected pass (exit 0) or a failure for any
      # other reason (no offender line) turns the step red.
      - if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          if out=$(pnpm --filter @ap/platform-web exec node scripts/check-prod-graph.ts --force-mock 2>&1); then echo "$out"; exit 1; fi
          echo "$out" | grep -q 'check:prod-graph FAILED (--force-mock)' && echo "$out" | grep -q '\[packages/adapters/mock-server/\]'
      - if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          if out=$(pnpm --filter @ap/platform-web exec node scripts/check-prod-graph.ts --force-mock-build 2>&1); then echo "$out"; exit 1; fi
          echo "$out" | grep -q 'failed as it must' && echo "$out" | grep -q 'production build bundles mock/dev code'
      - name: Real production build (DB-free)
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: pnpm --filter @ap/platform-web build:real-prod
      # #1678: the real build is what the edge serves, so the start-up closure is checked here too (the mock build is checked above;
      # build:real-prod overwrites the same dist, so this reads the real one).
      - name: Real build keeps heavy engines out of the start-up closure
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: node tooling/scripts/check-lazy-chunks.mjs apps/platform-web/dist
      # #1678: the production edge image (nginx + the real bundle, apps/platform-web/Dockerfile) is built from that dist and its
      # config is checked with `nginx -t` (the entrypoint renders the template first; the backend upstream is a runtime variable,
      # so no backend is needed). A broken Dockerfile, empty bundle or nginx syntax error fails here, not at the install site.
      - name: Edge image builds and nginx -t passes
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          DOCKER_BUILDKIT=1 docker build -f apps/platform-web/Dockerfile -t platform-release-web:ci .
          docker run --rm --memory 256m platform-release-web:ci nginx -t
      # Entries older than 7 days are dropped before the save (a failure here must not skip the save). GitHub evicts the least recently used caches above the repository limit (10 GB).
      - name: Prune turbo cache
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-static-${{ github.sha }}

  # #1951: typecheck runs beside Platform static, not inside it. Cold, it took 281-392 s of a 14-19 min static job; raising turbo
  # concurrency alone did not help (361 s at 4). The required check name and meaning stay: Platform workspace requires this job.
  platform-typecheck:
    name: Platform typecheck
    needs: changes
    # Never skipped as a whole: the aggregate required check reads its result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
      TURBO_FORCE: ${{ needs.changes.outputs.full != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.DOCS_ONLY != 'true' }}
      # Same rule as the static cache: restored on every non-full run, saved only by a push to main.
      - uses: actions/cache/restore@v4
        if: ${{ env.DOCS_ONLY != 'true' && env.TURBO_FORCE != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-typecheck-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-typecheck-
      # The job runs nothing else, so it may use all 4 vCPUs (turbo.json keeps 2 for local runs and the vitest jobs).
      - run: pnpm typecheck --concurrency=4
        if: ${{ env.DOCS_ONLY != 'true' }}
      - name: Prune turbo cache
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-typecheck-${{ github.sha }}

  # `pnpm test` beside Platform static. #166: turbo concurrency is capped at 2 in turbo.json (vitest workers × parallel packages oversubscribe a runner or a 16 GB Mac).
  # #1680: three package groups on three runners, so the longest package (`@ap/feature-screens`, ~560 s of vitest in the
  # v0.35.0 cold run) no longer queues behind the other 46 (~1,190 s together, turbo runs 2 at a time). Shard 3 is
  # "everything else" written only as exclusions, so a new package is tested without editing this list; its
  # exclusions must name exactly what shards 1 and 2 include (`.github/scripts/check-unified-ci.test.mjs` checks it).
  # `needs.platform-test.result` is success only when every shard succeeds, so the required aggregate is unchanged.
  platform-test:
    name: Platform test (${{ matrix.label }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Runaway guard, not a budget (#1680: #1749 was cancelled twice at 30 with no failing test on the old single job).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alone on its runner, the package may use every vCPU (same total-workers rule as below).
          - { shard: 1, label: feature-screens, filter: "--filter=@ap/feature-screens", workers: '4' }
          - { shard: 2, label: sdk + platform-web, filter: "--filter=./packages/sdk/* --filter=@ap/platform-web", workers: '2' }
          - { shard: 3, label: menus + others, filter: "--filter=!@ap/platform-api --filter=!@ap/feature-screens --filter=!./packages/sdk/* --filter=!@ap/platform-web", workers: '2' }
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
      TURBO_FORCE: ${{ needs.changes.outputs.full != 'false' }}
      # Total vitest workers = runner vCPUs: turbo runs 2 packages at once (turbo.json concurrency) × 2 workers = 4 on the 4-vCPU
      # ubuntu-latest. Uncapped, each package starts ncpu-1 workers (6 on 4 vCPUs) that compete for CPU, and a jsdom test that takes
      # about 1 s alone takes 3-4 s, so tests near vitest's 5 s default time out in some runs (#1559: measured 1.3-1.8 s max per test
      # with the cap vs 2.6-3.5 s without, for a 10-15 % longer package run). Same values as ~/.zshenv; the 5 s timeout stays as is.
      # Shard 1 runs one package, so its cap is 4 (one package × 4 workers = 4 vCPUs).
      VITEST_MAX_WORKERS: ${{ matrix.workers }}
      VITEST_MAX_FORKS: ${{ matrix.workers }}
      VITEST_MAX_THREADS: ${{ matrix.workers }}
      VITEST_MIN_FORKS: '1'
      VITEST_MIN_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        if: ${{ env.DOCS_ONLY != 'true' }}
      - uses: pnpm/action-setup@v6
        if: ${{ env.DOCS_ONLY != 'true' }}
      - uses: actions/setup-node@v5
        if: ${{ env.DOCS_ONLY != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.DOCS_ONLY != 'true' }}
      # turbo cache (#1019): restored on every non-full run, saved only by a push to main so PR runs cannot grow the cache.
      - uses: actions/cache/restore@v4
        if: ${{ env.DOCS_ONLY != 'true' && env.TURBO_FORCE != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-test-${{ matrix.shard }}-
      # Load context for a vitest `Timeout calling "onTaskUpdate"` or a 5 s test timeout (#1227): runner CPUs, load and the worker cap in force.
      - name: Runner load context
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          echo "vCPUs=$(nproc) loadavg=$(cut -d' ' -f1-3 /proc/loadavg) VITEST_MAX_WORKERS=$VITEST_MAX_WORKERS"
      # @ap/platform-api is in no shard: the `feature-integration` job runs its whole suite once, against a database, on every code PR. The root `test` script stays `turbo run test` (local verify=full uses it).
      # `set -f` keeps the shell from expanding `./packages/sdk/*`; turbo reads it as a workspace path glob.
      - name: Test (shard ${{ matrix.shard }})
        if: ${{ env.DOCS_ONLY != 'true' }}
        env:
          SHARD_FILTER: ${{ matrix.filter }}
        run: |
          set -f
          pnpm exec turbo run test $SHARD_FILTER
      # Entries older than 7 days are dropped before the save (a failure here must not skip the save). GitHub evicts the least recently used caches above the repository limit (10 GB).
      - name: Prune turbo cache
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-test-${{ matrix.shard }}-${{ github.sha }}

  feature-integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: Platform API · Backend integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #1680: the suite runs one file at a time (fileParallelism: false, one shared DB) and was the PR critical path
    # (~16 min, vitest ~944 s). Each shard is its own job with its own Postgres service, so the shards share no data.
    # The aggregate below reads `needs.feature-integration.result`, which fails when any shard fails.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # Google's Docker Hub mirror (same digest): GitHub runners hit Docker Hub's unauthenticated pull limit.
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: bash ops/platform-api/scripts/ci/gate.sh integration --shard=${{ matrix.shard }}/3
        env:
          CI_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The service container log is printed only when the job ends; on failure, put its slow statements (log_min_duration_statement),
      # lock waits and deadlocks into the job summary where the failed test is read (#1227).
      - name: Postgres slow statements and lock waits
        if: ${{ failure() }}
        run: |
          id=$(docker ps -q --filter "ancestor=mirror.gcr.io/pgvector/pgvector:pg16" | head -n1)
          if [ -z "$id" ]; then echo "postgres container not found" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "### Postgres: statements over 1 s, lock waits, deadlocks (last 40)"
            echo '```'
            docker logs "$id" 2>&1 | grep -E 'duration: [0-9]{4,}\.[0-9]+ ms|still waiting|acquired .*after|deadlock' | cut -c1-400 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Not a required check (OPS-01, #1266 b1a): builds the release images from a clean context so a missing workspace manifest,
  # source or emitted export fails here instead of on the host. It runs on every code change but the steps start only when a
  # PR touches an image input (Dockerfile, .dockerignore, lockfile/workspace files, a closure package, ops scripts the
  # image COPYs); push and manual runs always build. No push, no credentials.
  backend-images:
    name: Backend images (docker build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && git diff --no-renames --name-only "$BASE" "$HEAD" > changed.txt; then
            if grep -Eq '^(apps/platform-api/|packages/(sdk/contracts|sdk/contract-schemas|adapters/http-adapter|adapters/server-conformance|feature-shared)/|tooling/(eslint|tsconfig)/|ops/platform-api/|patches/|\.dockerignore$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)' changed.txt; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.gate.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/platform-api/Dockerfile
          target: runtime
          load: true
          push: false
          tags: platform-api-runtime:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max
      - name: Build migrate image
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/platform-api/Dockerfile
          target: migrate
          load: true
          push: false
          tags: platform-api-migrate:ci
          cache-from: type=gha,scope=backend-image
      # Every @ap/* package the server imports at runtime (apps/platform-api/src, non-test) must resolve to emitted JS in the
      # runtime image, and the runtime image must not carry dev dependencies.
      - name: Runtime image resolves workspace imports
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          docker run --rm --entrypoint node platform-api-runtime:ci --input-type=module -e "
            const cs = await import('@ap/contract-schemas');
            const fs = await import('@ap/feature-shared');
            const en = await import('@ap/feature-shared/enums');
            for (const [name, mod] of Object.entries({ cs, fs, en })) {
              if (Object.keys(mod).length === 0) throw new Error(name + ' has no exports');
            }
            for (const dev of ['@ap/contracts', '@ap/http-adapter', '@ap/server-conformance', 'vitest', 'typescript']) {
              // Resolve without evaluating: only a not-found error counts as absent; any other error fails the step.
              let present = true;
              try { import.meta.resolve(dev); } catch (error) { if (error?.code !== 'ERR_MODULE_NOT_FOUND') throw error; present = false; }
              if (present) throw new Error('dev dependency present in runtime image: ' + dev);
            }
          "

  # #1702g: isolation is conservative until the host measures the three installs/builds/browser runs.
  # platform-static has already passed sdk:consumer-check and sdk-consumer-negatives.mjs before this job starts.
  sdk-upgrade-gate:
    name: SDK upgrade gate
    needs: [changes, platform-static]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.platform-static.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright image matches @playwright/test
        run: test "$(node -p "require('./apps/platform-e2e/node_modules/@playwright/test/package.json').version")" = "1.63.0"
      - name: SDK upgrade gate
        run: |
          # The container runs as another uid than the checkout owner; git refuses the tree otherwise (sdk-kit.mjs lists tracked files).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          pnpm sdk:pack --out "$out"
          node tooling/sdk/sdk-upgrade-gate.mjs "$out"

  # The self-test packs the tree at two versions and replays the whole sequence (about 35 minutes measured on the host), so it
  # runs in its own job and only when the gate's own files change, or on a push to the base branch. The job always runs and skips
  # its steps, so the required verdict can still demand `success`.
  sdk-upgrade-gate-selftest:
    name: SDK upgrade gate self-test
    needs: [changes, platform-static]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.platform-static.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scope
        id: scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -Eq '^(tooling/sdk/sdk-upgrade-gate|tooling/sdk/sdk-bundle-check\.mjs|tooling/sdk/previous-bundle\.json|apps/platform-e2e/(playwright\.kit\.config|tests-kit/))'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v6
        if: ${{ steps.scope.outputs.run == 'true' }}
      - uses: actions/setup-node@v5
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.scope.outputs.run == 'true' }}
      - name: SDK upgrade gate self-test
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: node tooling/sdk/sdk-upgrade-gate.mjs --self-test

  # The required check keeps its name (ruleset `main: required CI`). A required job skipped as a whole would report Success, so this one always runs
  # and fails unless static, test and integration are success (docs-only permits only the intentional integration skip).
  platform-workspace:
    name: Platform workspace (pnpm monorepo)
    needs: [changes, platform-static, platform-typecheck, platform-test, feature-integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: All workspace gates succeeded
        env:
          STATIC: ${{ needs.platform-static.result }}
          TYPECHECK: ${{ needs.platform-typecheck.result }}
          TEST: ${{ needs.platform-test.result }}
          INTEGRATION: ${{ needs.feature-integration.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          .github/scripts/require-success.sh "static=$STATIC" "typecheck=$TYPECHECK" "test=$TEST"
          if [ "$CODE" != false ] || [ "$INTEGRATION" != skipped ]; then .github/scripts/require-success.sh "integration=$INTEGRATION"; fi

  # #666: the contract suite (~600 s of tests on one worker) runs as Playwright shards in parallel. Each shard starts
  # its own dev server and runs its contiguous slice serially (fullyParallel + workers: 1), so evidence stays in contract
  # order. A whole run uses 8 shards (e2e_total, #1931: Playwright splits by test count, and the slow board tests clump in shard 1; 4 left it near 12 min, 6 near 10); a selected-spec run (#1019) is one shard with the spec list appended.
  # Empty outputs (`changes` failed) fall back to the whole run: 4 shards, no spec list, base-path run.
  platform-contracts-e2e-shard:
    name: Platform contracts (E2E shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total || '8' }})
    needs: changes
    # Not a required check, so skipping it is safe (the aggregate below reads `e2e == 'none'` for the verdict); runs when `changes` failed (no output).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e != 'none' }}
    runs-on: ubuntu-latest
    # #669: the shard time was never the test slices (≈220–250 s each, balanced) but `playwright install --with-deps`,
    # whose apt download of fonts/libnss3 from the runner mirror sometimes took 700+ s on one shard. The official image
    # ships Chromium and its system packages. Its tag must match `@playwright/test` in apps/platform-e2e/package.json;
    # the guard step below fails the job when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Playwright's Docker guidance: Chromium can crash on Docker's 64 MB default /dev/shm.
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end so the merged report lists every failing contract, not only the first shard's.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image tag above and @playwright/test must move together; fail loudly instead of drifting.
      - name: Playwright image matches @playwright/test
        run: |
          want="$(node -p "require('./apps/platform-e2e/node_modules/@playwright/test/package.json').version")"
          test "$want" = "1.63.0" || { echo "::error::@playwright/test is $want but the E2E container is mcr.microsoft.com/playwright:v1.63.0-noble — bump both"; exit 1; }
      - name: Start kit browser check
        if: ${{ matrix.shard == 1 && needs.changes.outputs.e2e_kit != 'false' && github.event_name != 'pull_request' }}
        run: |
          out="$(mktemp -d)"
          kit_dir_file="$out/kit-dir"
          trap 'if [ -f "$kit_dir_file" ]; then kit_dir=$(cat "$kit_dir_file"); rm -rf "$kit_dir"; fi; rm -rf "$out"' EXIT
          pnpm sdk:pack --out "$out"
          AP_SDK_KIT_DIR_FILE="$kit_dir_file" pnpm sdk:consumer-check "$out"
          export AP_SDK_KIT_DIR="$(cat "$kit_dir_file")"
          pnpm --filter @ap/platform-e2e exec playwright test --config playwright.kit.config.ts
      - name: Upload start kit browser evidence
        if: ${{ matrix.shard == 1 && needs.changes.outputs.e2e_kit != 'false' && github.event_name != 'pull_request' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-start-kit-browser-report
          path: |
            apps/platform-e2e/playwright-report/kit/
            apps/platform-e2e/test-results/kit/
          retention-days: 14
      # pnpm forwards the flags to `playwright test` as they are (no `--`, which Playwright would read as file filters).
      # The blob reporter replaces the configured reporters; the final job merges the blobs into one contract report.
      # A spec selection (#1019) is appended as positional paths relative to apps/platform-e2e; 'all' and empty (`changes` failed) run every spec.
      # (A container job's default shell is `sh`: POSIX only.)
      - name: Run contracts
        if: ${{ needs.changes.outputs.e2e != 'base-path-only' }}
        env:
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          set --
          if [ "$E2E" != all ] && [ -n "$E2E" ]; then for s in $E2E; do set -- "$@" "tests/$s"; done; fi
          pnpm e2e --shard=${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total || '8' }} --reporter=list,blob "$@"
      # 하위 경로 배포(#318, ADR-0030): 별도 mock 빌드·preview(4191)에서 base 유지 계약을 확인한다.
      # Runs once, on the last shard, regardless of the shard's own result; skipped only when the selection says it is unaffected ('false'; empty = run).
      - if: ${{ matrix.shard == fromJSON(needs.changes.outputs.e2e_total || '8') && needs.changes.outputs.e2e_base_path != 'false' && !cancelled() }}
        run: pnpm e2e:base-path
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.changes.outputs.e2e != 'base-path-only' }}
        with:
          name: platform-e2e-blob-${{ matrix.shard }}
          path: apps/platform-e2e/blob-report/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.shard == fromJSON(needs.changes.outputs.e2e_total || '8') && needs.changes.outputs.e2e_base_path != 'false' && !cancelled() }}
        with:
          name: platform-e2e-base-path-report
          path: apps/platform-e2e/contract-report/base-path/
          retention-days: 1

  # One job under the old name: it merges the shard blobs into the single per-item report and carries the verdict, so a
  # required status check keeps naming `Platform contracts (E2E)` however the shards change.
  platform-contracts-e2e:
    name: Platform contracts (E2E)
    needs: [changes, platform-contracts-e2e-shard, sdk-upgrade-gate, sdk-upgrade-gate-selftest]
    # Required check: always runs, never Skipped. A Markdown-only run or a run with no affected spec (e2e == 'none') only runs the verdict and passes;
    # otherwise it also runs when a shard failed. MERGE_REPORT is 'false' only when there are no blobs to merge (nothing selected, or the base-path run alone);
    # BASE_ONLY is the base-path run alone: no pnpm, only the base-path report is downloaded, summarised in one line and published. Empty outputs (`changes` failed) → the whole run.
    if: ${{ !cancelled() }}
    env:
      MERGE_REPORT: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e != 'none' && needs.changes.outputs.e2e != 'base-path-only' }}
      BASE_ONLY: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e == 'base-path-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The verdict script needs only .github/scripts; the full tree only when a report is merged.
      - uses: actions/checkout@v5
        if: ${{ !cancelled() }}
        with:
          sparse-checkout: ${{ env.MERGE_REPORT != 'true' && '.github/scripts' || '' }}
      - uses: pnpm/action-setup@v6
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
      - uses: actions/setup-node@v5
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
      - uses: actions/download-artifact@v4
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        with:
          pattern: platform-e2e-blob-*
          path: apps/platform-e2e/blob-report
          merge-multiple: true
      # Writes contract-report/ (README.md, results.json, evidence/) and playwright-report/ as one serial run would.
      - run: pnpm --filter @ap/platform-e2e e2e:merge
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
      # After the merge: the contract reporter clears contract-report/ when it starts.
      - uses: actions/download-artifact@v4
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        continue-on-error: true
        with:
          name: platform-e2e-base-path-report
          path: apps/platform-e2e/contract-report/base-path
      # Base-path run alone: nothing to merge, but its report is still published (same artifact name as the merged run).
      - uses: actions/download-artifact@v4
        if: ${{ env.BASE_ONLY == 'true' && !cancelled() }}
        continue-on-error: true
        with:
          name: platform-e2e-base-path-report
          path: apps/platform-e2e/contract-report/base-path
      - name: Base-path report → job summary
        if: ${{ env.BASE_ONLY == 'true' && !cancelled() }}
        run: |
          echo "Contract report - base-path run only (main-config specs not selected); the report is in the platform-contract-report artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ env.BASE_ONLY == 'true' && !cancelled() }}
        with:
          name: platform-contract-report
          path: apps/platform-e2e/contract-report/
          retention-days: 14
          if-no-files-found: warn
      # 항목별 통과/실패 표를 Job 요약에 싣고, 증거 스크린샷은 아티팩트로 남긴다(#44). 실패해도 보고는 남긴다.
      - name: Contract report → job summary
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        run: cat apps/platform-e2e/contract-report/README.md >> "$GITHUB_STEP_SUMMARY" || echo "contract report missing (suite did not start)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        with:
          name: platform-contract-report
          path: |
            apps/platform-e2e/contract-report/
            apps/platform-e2e/playwright-report/
          retention-days: 14
      # The merge succeeds even when contracts failed; the verdict is the shards' result (failure, or skipped/cancelled when a shard never ran),
      # except when nothing needed to run (docs-only, or e2e == 'none'). Table-tested in e2e-verdict.sh --self-test; writes the one-line "E2E: …" summary.
      - name: SDK upgrade verdict
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ needs.changes.outputs.code }}
          UPGRADE: ${{ needs.sdk-upgrade-gate.result }}
          SELFTEST: ${{ needs.sdk-upgrade-gate-selftest.result }}
        # A pull request skips both jobs on purpose (#1931 PR minimal mode); main push and manual runs require them.
        run: |
          if [ "$CODE" != false ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then .github/scripts/require-success.sh "sdk-upgrade=$UPGRADE" "sdk-upgrade-selftest=$SELFTEST"; fi
      - name: Shard verdict
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ needs.changes.outputs.code }}
          E2E: ${{ needs.changes.outputs.e2e }}
          E2E_BASE_PATH: ${{ needs.changes.outputs.e2e_base_path }}
          SHARD_RESULT: ${{ needs.platform-contracts-e2e-shard.result }}
        run: .github/scripts/e2e-verdict.sh

  # #608: the Pages workflow captures the intro site only on release, so a menu or shell change that broke `shots.mjs`
  # surfaced at the next deploy. This runs the same build → capture → assemble → check chain on the PR. Not a required
  # check (skipping is safe); the Playwright image avoids `playwright install --with-deps` (#669) and must carry the same
  # tag as the E2E shards (their guard step fails when it drifts from @playwright/test).
  site-shots:
    name: Intro site captures
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.site != 'false' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        # A container job's default shell is `sh` (dash): no `${var::n}`, no pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build demo (mock, sub-path)
        env:
          AP_BASE_PATH: /analytics-platform/demo/
        run: pnpm --filter @ap/platform-web build
      - name: Capture, assemble and check the site
        run: |
          # No `git rev-parse` here: inside the container job git refuses the checkout (dubious ownership) and prints nothing.
          node site/scripts/shots.mjs --demo apps/platform-web/dist --out _shots
          node site/scripts/assemble.mjs --out "$RUNNER_TEMP/_site" --site-base /analytics-platform/ --ref "$GITHUB_SHA" --commit "${GITHUB_SHA::7}" --demo apps/platform-web/dist --shots _shots
          node site/scripts/check-assembled.mjs --site "$RUNNER_TEMP/_site" --captures _shots --browser
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: site-shots
          path: _shots/
          retention-days: 3
