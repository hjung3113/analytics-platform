name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled: `css-removal-ok` 라벨을 다는 것만으로 css-selectors 재평가(#58).
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 경로 필터 없이 매 push/PR마다 6개 Job을 모두 실행한다(레포가 작아 단순함 우선).
# 체크아웃은 모두 submodules: false — 어느 프로토타입도 products/feedbackops를 런타임에 참조하지 않으므로(이식이지 참조가 아님) 서브모듈을 초기화하지 않는다.

jobs:
  python-codec:
    name: Python codec (kernel-context-url-scope)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-context-url-scope
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          # README requires "Python 3.9+ standard library only" (stdlib only, no version-specific features).
          # Pinned to 3.12 rather than the 3.9 verified locally: 3.9 reached EOL 2025-10 and risks disappearing
          # from setup-python's version manifest on ubuntu-latest. Reverified 14/14 passing on 3.12 before this change.
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python3 -m pytest test_context_url.py -q

  unit-a-app-shell:
    name: Unit A (kernel-app-shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-app-shell
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README: "설치된 Node 26.7.0 / npm 11.19.0으로 검증했다"
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: prototypes/kernel-app-shell/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  unit-b-chart-frame:
    name: Unit B (kernel-chart-frame)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-chart-frame
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README에 Node 버전 명시 없음 → Active LTS
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/kernel-chart-frame/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  unit-c-platform-table:
    name: Unit C (kernel-platform-table)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kernel-platform-table
    env:
      # playwright.config.ts는 PLAYWRIGHT_BROWSERS_PATH ||= resolve('.browsers')를 설정하지만
      # `playwright install`은 config를 읽지 않아 기본 ~/.cache/ms-playwright에 설치한다.
      # install/run 양쪽이 같은 .browsers 경로를 쓰도록 Job 전체에 명시한다(README의 설치 커맨드와 동일).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/prototypes/kernel-platform-table/.browsers
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README에 Node 버전 명시 없음 → Active LTS
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/kernel-platform-table/package-lock.json
      - run: npm ci
      # package.json에 typecheck 스크립트가 없고 build가 `tsc --noEmit && vite build`로 타입 검사를 포함한다.
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Verify Chromium landed in PLAYWRIGHT_BROWSERS_PATH
        run: ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*
      - run: npm run test:browser
      - run: npm run build

  platform-workspace:
    name: Platform workspace (pnpm monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      # pnpm 버전은 루트 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          # 로컬 검증 환경(Node 26.7.0 / pnpm 11.1.1)과 동일.
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  platform-contracts-e2e:
    name: Platform contracts (E2E)
    runs-on: ubuntu-latest
    env:
      # 설치와 실행이 같은 경로를 보도록 Job 전체에 명시한다(config는 기본 캐시를 쓰고 이 변수를 따른다).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/platform-e2e/.browsers
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ap/platform-e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      # 항목별 통과/실패 표를 Job 요약에 싣고, 증거 스크린샷은 아티팩트로 남긴다(#44). 실패해도 보고는 남긴다.
      - name: Contract report → job summary
        if: ${{ !cancelled() }}
        run: cat apps/platform-e2e/contract-report/README.md >> "$GITHUB_STEP_SUMMARY" || echo "contract report missing (suite did not start)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-contract-report
          path: |
            apps/platform-e2e/contract-report/
            apps/platform-e2e/playwright-report/
          retention-days: 14

  css-selectors:
    # 빌드 산물의 selector 집합 비교(#58, 결정 #39/05). 픽셀 비교는 디자인 확정 뒤 과제.
    # 의도된 selector 제거 PR은 `css-removal-ok` 라벨로 통과시킨다(labeled/unlabeled에서 재평가).
    name: CSS selectors (build diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
          cache: pnpm
      - name: Build head
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ap/platform-web build
      - name: Collect head CSS
        # 앱 CSS는 청크 1개가 정상이고, 여러 개면 집합 비교라 순서 무관하게 이어 붙인다.
        run: cat apps/platform-web/dist/assets/*.css > "$RUNNER_TEMP/head.css"
      - name: Check out base worktree (merge-base with target branch)
        run: git worktree add "$RUNNER_TEMP/base" "$(git merge-base HEAD origin/${{ github.base_ref }})"
      - name: Build base
        working-directory: ${{ runner.temp }}/base
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ap/platform-web build
      - name: Collect base CSS
        run: cat "$RUNNER_TEMP/base/apps/platform-web/dist/assets/"*.css > "$RUNNER_TEMP/base.css"
      - name: Compare selector sets
        run: |
          ARGS=(--summary "$GITHUB_STEP_SUMMARY")
          if ${{ contains(github.event.pull_request.labels.*.name, 'css-removal-ok') }}; then
            ARGS+=(--allow-removal)
          fi
          node tooling/css-selectors/src/cli.ts "$RUNNER_TEMP/base.css" "$RUNNER_TEMP/head.css" "${ARGS[@]}"
