name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Release gate (#1019): the only run that is cold and whole. `gh workflow run ci.yml -f full=true` before the release tag.
  workflow_dispatch:
    inputs:
      full:
        description: 'Run everything cold: no turbo cache restore, turbo --force (release gate)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A manual run has its own group so it never cancels, or is cancelled by, the push/PR run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main and every manual run goes to the end so a red main is never hidden.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 워크플로 수준 경로 필터는 쓰지 않는다: 필수 검사가 아예 안 뜨면 병합이 Pending으로 막힌다. `changes` Job이 `.github/scripts/classify-changes.mjs`로 Markdown과 `.agents/` 아래만
# 바뀐 PR(#1018)을 가려 `code=false`를 내면, 필수 Job 둘(workspace·E2E 병합)은 그대로 돌되 무거운 단계만 건너뛴다(#671 B6, D2). 필수 Job을 Job 수준 `if`로
# 건너뛰면 Success로 보고되어, `changes`가 실패해도 필수 검사가 통과해 버린다 — 그래서 쓰지 않는다. 판정은 fail-safe다: `code`가
# 정확히 'false'일 때만 건너뛰고, `changes`가 실패하면(출력 없음) 전부 돈다. 프로토타입 4개 Job은 늘 돈다(Unit C는 docs/06을 읽는다).
# workspace 검사(#1019)는 turbo 캐시로 바뀐 패키지와 그 의존자만 다시 돈다(`.turbo/cache`를 main push가 저장하고 PR은 복원만 한다). 전체·cold는 `full`일 때뿐이다:
# `workflow_dispatch`의 `full=true`(릴리스 태그 전 수동), 또는 `changes`가 판단하지 못해 `full`이 'false'가 아닐 때(출력 없음 포함) → 캐시를 복원하지 않고 `TURBO_FORCE=true`.
# `Platform workspace (pnpm monorepo)`는 병렬 두 Job(Platform static·Platform test)의 모음 Job이고, 하위 결과가 둘 다 정확히 success일 때만 통과한다.
# E2E는 shard Job + 병합 Job(#666)이다. PR과 main push는 바뀐 것에 영향받는 spec만 돈다(`.github/scripts/select-e2e.mjs`, #1019): 판단하지 못하면 전부(shard 4개)이고, 전체는 `workflow_dispatch`의
# `full=true`(릴리스 태그 전)에서도 돈다. main push의 기준은 직전 커밋이 아니라 CI가 green이었던 마지막 main SHA다(`last-green-main-sha.mjs`) — 실패한 spec은 green이 될 때까지 범위에 남는다.
# FeedbackOps는 서브모듈이 아니라 일반 디렉터리(apps/{platform-api,feature-screens}·packages/feature-*·docs/feedbackops)라 checkout 옵션이 따로 없다(FeedbackOps CI는 feedbackops.yml). 프로토타입 4개 Job은 submodules: false를 명시한다.

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` lists the earlier CI runs for the main-push baseline (this job only).
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      site: ${{ steps.classify.outputs.site }}
      full: ${{ steps.classify.outputs.full }}
      e2e: ${{ steps.e2e.outputs.e2e }}
      e2e_base_path: ${{ steps.e2e.outputs.e2e_base_path }}
      e2e_shards: ${{ steps.e2e.outputs.e2e_shards }}
      e2e_total: ${{ steps.e2e.outputs.e2e_total }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The rules live in the script (with --self-test): code=false only for a PR whose every changed file is Markdown or under .agents/;
      # site=false only for a PR with a non-empty diff that touches nothing the intro-site captures depend on (#608);
      # full=true for a manual full=true run, and for anything the script cannot decide (it then prints code=true site=true full=true).
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FULL_INPUT: ${{ inputs.full }}
        run: node .github/scripts/classify-changes.mjs
      # Push to main only: the last main SHA whose CI run was green (empty when none/unreachable/API error → the E2E selection falls back to all).
      - id: baseline
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/last-green-main-sha.mjs
      # Which E2E specs the change can affect (rules in the script, with --self-test): e2e = all | none | base-path-only | a spec list; unknown anything → all.
      - id: e2e
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASELINE: ${{ steps.baseline.outputs.sha }}
          SHA: ${{ github.sha }}
          FULL_INPUT: ${{ inputs.full }}
        run: node .github/scripts/select-e2e.mjs

  python-codec:
    name: Python codec (kernel-context-url-scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/kernel-context-url-scope
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          # README requires "Python 3.9+ standard library only" (stdlib only, no version-specific features).
          # Pinned to 3.12 rather than the 3.9 verified locally: 3.9 reached EOL 2025-10 and risks disappearing
          # from setup-python's version manifest on ubuntu-latest. Reverified 14/14 passing on 3.12 before this change.
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python3 -m pytest test_context_url.py -q

  unit-a-app-shell:
    name: Unit A (kernel-app-shell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/kernel-app-shell
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README: "설치된 Node 26.7.0 / npm 11.19.0으로 검증했다"
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: archive/kernel-app-shell/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  unit-b-chart-frame:
    name: Unit B (kernel-chart-frame)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/kernel-chart-frame
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README에 Node 버전 명시 없음 → Active LTS
          node-version: '24'
          cache: npm
          cache-dependency-path: archive/kernel-chart-frame/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  unit-c-platform-table:
    name: Unit C (kernel-platform-table)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: archive/kernel-platform-table
    env:
      # playwright.config.ts는 PLAYWRIGHT_BROWSERS_PATH ||= resolve('.browsers')를 설정하지만
      # `playwright install`은 config를 읽지 않아 기본 ~/.cache/ms-playwright에 설치한다.
      # install/run 양쪽이 같은 .browsers 경로를 쓰도록 Job 전체에 명시한다(README의 설치 커맨드와 동일).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/archive/kernel-platform-table/.browsers
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          # README에 Node 버전 명시 없음 → Active LTS
          node-version: '24'
          cache: npm
          cache-dependency-path: archive/kernel-platform-table/package-lock.json
      - run: npm ci
      # package.json에 typecheck 스크립트가 없고 build가 `tsc --noEmit && vite build`로 타입 검사를 포함한다.
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Verify Chromium landed in PLAYWRIGHT_BROWSERS_PATH
        run: ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*
      - run: npm run test:browser
      - run: npm run build

  # Lint, typecheck, build and the checks that need the build output (#1019 splits the old single job so `pnpm test` runs beside it).
  platform-static:
    name: Platform static
    needs: changes
    # Runs even when `changes` failed (then every step runs). Never skipped as a whole: the aggregate required check reads its result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 'false' only for a Markdown-only PR; empty (changes failed) or 'true' runs every step.
      DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
      # Cold and whole when `full` is 'true' (release gate) or empty (changes failed): the turbo cache is neither restored nor trusted.
      TURBO_FORCE: ${{ needs.changes.outputs.full != 'false' }}
    steps:
      - uses: actions/checkout@v5
      # pnpm 버전은 루트 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          # 로컬 검증 환경(Node 26.7.0 / pnpm 11.1.1)과 동일.
          node-version: '26.7.0'
          cache: pnpm
      # Relative links and heading anchors in tracked Markdown (CLAUDE.md symlinks and vendored skills excluded); every PR; node builtins only, before install.
      - run: node .github/scripts/check-doc-links.mjs
      - run: pnpm install --frozen-lockfile
        if: ${{ env.DOCS_ONLY != 'true' }}
      # turbo cache (#1019): restored on every non-full run, saved only by a push to main so PR runs cannot grow the cache.
      - uses: actions/cache/restore@v4
        if: ${{ env.DOCS_ONLY != 'true' && env.TURBO_FORCE != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26.7.0-static-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node26.7.0-static-
      - name: Guard FeedbackOps out of platform task graph
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          node .github/scripts/check-platform-turbo-scope.mjs
          node .github/scripts/check-platform-turbo-scope.mjs --self-test
      - run: pnpm lint
        if: ${{ env.DOCS_ONLY != 'true' }}
      - run: pnpm typecheck
        if: ${{ env.DOCS_ONLY != 'true' }}
      - run: pnpm build
        if: ${{ env.DOCS_ONLY != 'true' }}
      # ADR-0067 (#575): the Dockview engine stays a lazy chunk — no start-up chunk of the app contains it.
      - if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          pnpm check:lazy-chunks
          pnpm check:lazy-chunks --self-test
      # #520: snapshot the built declaration surface before sdk:pack clears and rebuilds dist.
      - name: SDK public API snapshots
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          pnpm sdk:api
          pnpm sdk:api --self-test
          pnpm sdk:test
      # #430: verify the packed contracts package in an external consumer.
      - run: pnpm --filter @ap/contracts check:pack
        if: ${{ env.DOCS_ONLY != 'true' }}
      # #519 (ADR-0056): the five release tarballs, then a clean outside consumer installs them (install, tsc, vite build, CSS classes, vitest).
      - name: SDK release tarballs and outside consumer
        if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          out="$(mktemp -d)"
          pnpm sdk:pack --out "$out"
          pnpm sdk:consumer-check "$out"
      # #153 (ADR-0009): the production module graph (assembly external) carries no mock-server, menu mock or src/dev
      - run: pnpm --filter @ap/platform-web check:prod-graph
        if: ${{ env.DOCS_ONLY != 'true' }}
      # The checks must still bite (#153 review P3-1): the assembly forced to the mock must fail both the CI graph
      # check and the build-time guard of a real production build. An unexpected pass (exit 0) or a failure for any
      # other reason (no offender line) turns the step red.
      - if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          if out=$(pnpm --filter @ap/platform-web exec node scripts/check-prod-graph.ts --force-mock 2>&1); then echo "$out"; exit 1; fi
          echo "$out" | grep -q 'check:prod-graph FAILED (--force-mock)' && echo "$out" | grep -q '\[packages/adapters/mock-server/\]'
      - if: ${{ env.DOCS_ONLY != 'true' }}
        run: |
          if out=$(pnpm --filter @ap/platform-web exec node scripts/check-prod-graph.ts --force-mock-build 2>&1); then echo "$out"; exit 1; fi
          echo "$out" | grep -q 'failed as it must' && echo "$out" | grep -q 'production build bundles mock/dev code'
      # Entries older than 7 days are dropped before the save (a failure here must not skip the save). GitHub evicts the least recently used caches above the repository limit (10 GB).
      - name: Prune turbo cache
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26.7.0-static-${{ github.sha }}

  # `pnpm test` beside Platform static. #166: turbo concurrency is capped at 2 in turbo.json (vitest workers × parallel packages oversubscribe a runner or a 16 GB Mac).
  platform-test:
    name: Platform test
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
      TURBO_FORCE: ${{ needs.changes.outputs.full != 'false' }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ env.DOCS_ONLY != 'true' }}
      - uses: pnpm/action-setup@v6
        if: ${{ env.DOCS_ONLY != 'true' }}
      - uses: actions/setup-node@v5
        if: ${{ env.DOCS_ONLY != 'true' }}
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.DOCS_ONLY != 'true' }}
      # turbo cache (#1019): restored on every non-full run, saved only by a push to main so PR runs cannot grow the cache.
      - uses: actions/cache/restore@v4
        if: ${{ env.DOCS_ONLY != 'true' && env.TURBO_FORCE != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26.7.0-test-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node26.7.0-test-
      - run: pnpm test
        if: ${{ env.DOCS_ONLY != 'true' }}
      # Entries older than 7 days are dropped before the save (a failure here must not skip the save). GitHub evicts the least recently used caches above the repository limit (10 GB).
      - name: Prune turbo cache
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        run: find .turbo/cache -type f -mtime +7 -delete || true
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && env.DOCS_ONLY != 'true' }}
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26.7.0-test-${{ github.sha }}

  # The required check keeps its name (ruleset `main: required CI`). A required job skipped as a whole would report Success, so this one always runs
  # and fails unless both halves are exactly `success` (a docs-only run is success: the halves run and skip their steps; skipped, cancelled, failure → red).
  platform-workspace:
    name: Platform workspace (pnpm monorepo)
    needs: [changes, platform-static, platform-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Both halves succeeded
        env:
          STATIC: ${{ needs.platform-static.result }}
          TEST: ${{ needs.platform-test.result }}
        run: .github/scripts/require-success.sh "static=$STATIC" "test=$TEST"

  # #666: the contract suite (~600 s of tests on one worker) runs as Playwright shards in parallel. Each shard starts
  # its own dev server and runs its contiguous slice serially (fullyParallel + workers: 1), so evidence stays in contract
  # order. A whole run uses 4 shards (e2e_total); a selected-spec run (#1019) is one shard with the spec list appended.
  # Empty outputs (`changes` failed) fall back to the whole run: 4 shards, no spec list, base-path run.
  platform-contracts-e2e-shard:
    name: Platform contracts (E2E shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total || '4' }})
    needs: changes
    # Not a required check, so skipping it is safe (the aggregate below reads `e2e == 'none'` for the verdict); runs when `changes` failed (no output).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e != 'none' }}
    runs-on: ubuntu-latest
    # #669: the shard time was never the test slices (≈220–250 s each, balanced) but `playwright install --with-deps`,
    # whose apt download of fonts/libnss3 from the runner mirror sometimes took 700+ s on one shard. The official image
    # ships Chromium and its system packages. Its tag must match `@playwright/test` in apps/platform-e2e/package.json;
    # the guard step below fails the job when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Playwright's Docker guidance: Chromium can crash on Docker's 64 MB default /dev/shm.
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end so the merged report lists every failing contract, not only the first shard's.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards || '[1,2,3,4]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image tag above and @playwright/test must move together; fail loudly instead of drifting.
      - name: Playwright image matches @playwright/test
        run: |
          want="$(node -p "require('./apps/platform-e2e/node_modules/@playwright/test/package.json').version")"
          test "$want" = "1.63.0" || { echo "::error::@playwright/test is $want but the E2E container is mcr.microsoft.com/playwright:v1.63.0-noble — bump both"; exit 1; }
      # pnpm forwards the flags to `playwright test` as they are (no `--`, which Playwright would read as file filters).
      # The blob reporter replaces the configured reporters; the final job merges the blobs into one contract report.
      # A spec selection (#1019) is appended as positional paths relative to apps/platform-e2e; 'all' and empty (`changes` failed) run every spec.
      # (A container job's default shell is `sh`: POSIX only.)
      - name: Run contracts
        if: ${{ needs.changes.outputs.e2e != 'base-path-only' }}
        env:
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          set --
          if [ "$E2E" != all ] && [ -n "$E2E" ]; then for s in $E2E; do set -- "$@" "tests/$s"; done; fi
          pnpm e2e --shard=${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total || '4' }} --reporter=list,blob "$@"
      # 하위 경로 배포(#318, ADR-0030): 별도 mock 빌드·preview(4191)에서 base 유지 계약을 확인한다.
      # Runs once, on the last shard, regardless of the shard's own result; skipped only when the selection says it is unaffected ('false'; empty = run).
      - if: ${{ matrix.shard == fromJSON(needs.changes.outputs.e2e_total || '4') && needs.changes.outputs.e2e_base_path != 'false' && !cancelled() }}
        run: pnpm e2e:base-path
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.changes.outputs.e2e != 'base-path-only' }}
        with:
          name: platform-e2e-blob-${{ matrix.shard }}
          path: apps/platform-e2e/blob-report/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.shard == fromJSON(needs.changes.outputs.e2e_total || '4') && needs.changes.outputs.e2e_base_path != 'false' && !cancelled() }}
        with:
          name: platform-e2e-base-path-report
          path: apps/platform-e2e/contract-report/base-path/
          retention-days: 1

  # One job under the old name: it merges the shard blobs into the single per-item report and carries the verdict, so a
  # required status check keeps naming `Platform contracts (E2E)` however the shards change.
  platform-contracts-e2e:
    name: Platform contracts (E2E)
    needs: [changes, platform-contracts-e2e-shard]
    # Required check: always runs, never Skipped. A Markdown-only run or a run with no affected spec (e2e == 'none') only runs the verdict and passes;
    # otherwise it also runs when a shard failed. MERGE_REPORT is 'false' only when there are no blobs to merge (nothing selected, or the base-path run alone);
    # BASE_ONLY is the base-path run alone: no pnpm, only the base-path report is downloaded, summarised in one line and published. Empty outputs (`changes` failed) → the whole run.
    if: ${{ !cancelled() }}
    env:
      MERGE_REPORT: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e != 'none' && needs.changes.outputs.e2e != 'base-path-only' }}
      BASE_ONLY: ${{ needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e == 'base-path-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The verdict script needs only .github/scripts; the full tree only when a report is merged.
      - uses: actions/checkout@v5
        if: ${{ !cancelled() }}
        with:
          sparse-checkout: ${{ env.MERGE_REPORT != 'true' && '.github/scripts' || '' }}
      - uses: pnpm/action-setup@v6
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
      - uses: actions/setup-node@v5
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
      - uses: actions/download-artifact@v4
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        with:
          pattern: platform-e2e-blob-*
          path: apps/platform-e2e/blob-report
          merge-multiple: true
      # Writes contract-report/ (README.md, results.json, evidence/) and playwright-report/ as one serial run would.
      - run: pnpm --filter @ap/platform-e2e e2e:merge
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
      # After the merge: the contract reporter clears contract-report/ when it starts.
      - uses: actions/download-artifact@v4
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        continue-on-error: true
        with:
          name: platform-e2e-base-path-report
          path: apps/platform-e2e/contract-report/base-path
      # Base-path run alone: nothing to merge, but its report is still published (same artifact name as the merged run).
      - uses: actions/download-artifact@v4
        if: ${{ env.BASE_ONLY == 'true' && !cancelled() }}
        continue-on-error: true
        with:
          name: platform-e2e-base-path-report
          path: apps/platform-e2e/contract-report/base-path
      - name: Base-path report → job summary
        if: ${{ env.BASE_ONLY == 'true' && !cancelled() }}
        run: |
          echo "Contract report - base-path run only (main-config specs not selected); the report is in the platform-contract-report artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ env.BASE_ONLY == 'true' && !cancelled() }}
        with:
          name: platform-contract-report
          path: apps/platform-e2e/contract-report/
          retention-days: 14
          if-no-files-found: warn
      # 항목별 통과/실패 표를 Job 요약에 싣고, 증거 스크린샷은 아티팩트로 남긴다(#44). 실패해도 보고는 남긴다.
      - name: Contract report → job summary
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        run: cat apps/platform-e2e/contract-report/README.md >> "$GITHUB_STEP_SUMMARY" || echo "contract report missing (suite did not start)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ env.MERGE_REPORT == 'true' && !cancelled() }}
        with:
          name: platform-contract-report
          path: |
            apps/platform-e2e/contract-report/
            apps/platform-e2e/playwright-report/
          retention-days: 14
      # The merge succeeds even when contracts failed; the verdict is the shards' result (failure, or skipped/cancelled when a shard never ran),
      # except when nothing needed to run (docs-only, or e2e == 'none'). Table-tested in e2e-verdict.sh --self-test; writes the one-line "E2E: …" summary.
      - name: Shard verdict
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ needs.changes.outputs.code }}
          E2E: ${{ needs.changes.outputs.e2e }}
          E2E_BASE_PATH: ${{ needs.changes.outputs.e2e_base_path }}
          SHARD_RESULT: ${{ needs.platform-contracts-e2e-shard.result }}
        run: .github/scripts/e2e-verdict.sh

  # #608: the Pages workflow captures the intro site only on release, so a menu or shell change that broke `shots.mjs`
  # surfaced at the next deploy. This runs the same build → capture → assemble → check chain on the PR. Not a required
  # check (skipping is safe); the Playwright image avoids `playwright install --with-deps` (#669) and must carry the same
  # tag as the E2E shards (their guard step fails when it drifts from @playwright/test).
  site-shots:
    name: Intro site captures
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        # A container job's default shell is `sh` (dash): no `${var::n}`, no pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build demo (mock, sub-path)
        env:
          AP_BASE_PATH: /analytics-platform/demo/
        run: pnpm --filter @ap/platform-web build
      - name: Capture, assemble and check the site
        run: |
          # No `git rev-parse` here: inside the container job git refuses the checkout (dubious ownership) and prints nothing.
          node site/scripts/shots.mjs --demo apps/platform-web/dist --out _shots
          node site/scripts/assemble.mjs --out "$RUNNER_TEMP/_site" --site-base /analytics-platform/ --ref "$GITHUB_SHA" --commit "${GITHUB_SHA::7}" --demo apps/platform-web/dist --shots _shots
          node site/scripts/check-assembled.mjs --site "$RUNNER_TEMP/_site" --captures _shots --browser
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: site-shots
          path: _shots/
          retention-days: 3
