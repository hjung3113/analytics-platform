# FeedbackOps gate (moved from the product directory's .github/workflows/ci.yml, #592).
# FeedbackOps is part of the root pnpm workspace (ADR-0066, #642): this workflow installs at the repo root with the root
# pnpm/Node/lockfile, then runs the gates from the repository root. It runs when the FeedbackOps apps and packages (apps/fo-*,
# packages/fo-*), its docs (docs/feedbackops), its tool package (ops/feedbackops), the shared @ap/ui package, the platform packages its backend tests import, or the workspace toolchain
# files change.
# The commands live in ops/feedbackops/scripts/ci/gate.sh; this file provides Node, pnpm and Postgres.
name: FeedbackOps

on:
  pull_request:
    paths:
      - 'docs/feedbackops/**'
      - 'apps/fo-*/**'
      - 'packages/fo-*/**'
      - 'ops/feedbackops/**'
      - 'packages/ui/**'
      # Backend tests read @ap/contracts/vocab.json and run @ap/server-conformance through @ap/http-adapter (#674).
      - 'packages/contracts/**'
      - 'packages/http-adapter/**'
      - 'packages/server-conformance/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/feedbackops.yml'
  push:
    branches: [main]
    paths:
      - 'docs/feedbackops/**'
      - 'apps/fo-*/**'
      - 'packages/fo-*/**'
      - 'ops/feedbackops/**'
      - 'packages/ui/**'
      # Backend tests read @ap/contracts/vocab.json and run @ap/server-conformance through @ap/http-adapter (#674).
      - 'packages/contracts/**'
      - 'packages/http-adapter/**'
      - 'packages/server-conformance/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/feedbackops.yml'
  workflow_dispatch:

concurrency:
  group: feedbackops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  static:
    name: FeedbackOps · Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the FE Biome gate diffs merge-base(HEAD, base)..HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck, boundaries, migration drift, FE typecheck, design lint, FE Biome
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=origin/main; fi
          bash ops/feedbackops/scripts/ci/gate.sh static ${base:+--base "$base"}

  unit:
    name: FeedbackOps · Unit tests (frontend, ui, shared)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: bash ops/feedbackops/scripts/ci/gate.sh unit

  integration:
    name: FeedbackOps · Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Google's Docker Hub mirror (same digest): GitHub runners hit Docker Hub's unauthenticated pull limit.
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: bash ops/feedbackops/scripts/ci/gate.sh integration
        env:
          CI_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
