# FeedbackOps gate (moved from products/feedbackops/.github/workflows/ci.yml, #592).
# FeedbackOps keeps its own nested pnpm workspace, Node and pnpm, so this workflow installs inside
# products/feedbackops and runs only when that directory (or this file) changes.
# The commands live in products/feedbackops/scripts/ci/gate.sh; this file provides Node, pnpm and Postgres.
name: FeedbackOps

on:
  pull_request:
    paths:
      - 'products/feedbackops/**'
      - '.github/workflows/feedbackops.yml'
  push:
    branches: [main]
    paths:
      - 'products/feedbackops/**'
      - '.github/workflows/feedbackops.yml'
  workflow_dispatch:

concurrency:
  group: feedbackops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: products/feedbackops

jobs:
  static:
    name: FeedbackOps · Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the FE Biome gate diffs merge-base(HEAD, base)..HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: products/feedbackops/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: products/feedbackops/.nvmrc
          cache: pnpm
          cache-dependency-path: products/feedbackops/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, boundaries, migration drift, FE typecheck, design lint, FE Biome
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The PR that introduces the directory (#592) has no FeedbackOps tree on main to diff against: every file
            # would count as changed and fail on diagnostics that predate the merge, so the FE Biome gate is skipped there.
            if git cat-file -e origin/main:products/feedbackops/package.json 2>/dev/null; then base=origin/main; fi
          fi
          scripts/ci/gate.sh static ${base:+--base "$base"}

  unit:
    name: FeedbackOps · Unit tests (frontend, ui, shared)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: products/feedbackops/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: products/feedbackops/.nvmrc
          cache: pnpm
          cache-dependency-path: products/feedbackops/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/gate.sh unit

  integration:
    name: FeedbackOps · Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Google's Docker Hub mirror (same digest): GitHub runners hit Docker Hub's unauthenticated pull limit.
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: products/feedbackops/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: products/feedbackops/.nvmrc
          cache: pnpm
          cache-dependency-path: products/feedbackops/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/gate.sh integration
        env:
          CI_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
