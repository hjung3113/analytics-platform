# docs/integration/platform-packages.md §3, §7.
# Only FeedbackOps packages/ui and packages/shared join this workspace; the rest keeps its own workspace.
# prototypes/* are standalone npm units.
packages:
  - apps/*
  - packages/*
  - menus/*
  - tooling/*
  - products/feedbackops/packages/ui
  - products/feedbackops/packages/shared
allowBuilds:
  esbuild: true
