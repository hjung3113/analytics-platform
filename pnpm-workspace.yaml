# docs/integration/platform-packages.md §3, §7.
# products/feedbackops keeps its own workspace; prototypes/* are standalone npm units.
packages:
  - apps/*
  - packages/*
  - menus/*
  - tooling/*
  - products/feedbackops/packages/ui
  - products/feedbackops/packages/shared
allowBuilds:
  esbuild: true
overrides:
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
