# docs/integration/platform-packages.md §3.
# FeedbackOps joins this workspace (ADR-0066 decision 1, #642); its packages and its tool package (ops/platform-api, @ap/platform-api-ops)
# use role-based @ap identities and participate in unified root tasks.
# archive/* are standalone npm units.
packages:
  - apps/*
  - packages/*
  - packages/sdk/*
  - packages/adapters/*
  - menus/*/*
  - platform/*
  - tooling/*
  - ops/*
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
patchedDependencies:
  "@formkit/auto-animate@0.10.0": patches/@formkit__auto-animate@0.10.0.patch
# FeedbackOps resolves every @tiptap package to 3.23.5 (its lockfile at a8d768b8). The ^3.23.5 ranges of starter-kit's
# extensions otherwise float to 3.32.0, whose extension-list needs a newer @tiptap/core (#443).
overrides:
  # FeedbackOps' backend declares tsx 4.19.2; vite 7 lists tsx as an optional peer, so without this removal pnpm adds tsx to the
  # peer suffix of every platform vite/vitest instance and rewrites all platform importers (#642). Platform never uses that peer.
  "vite>tsx": "-"
  "@tiptap/extension-blockquote": 3.23.5
  "@tiptap/extension-bold": 3.23.5
  "@tiptap/extension-bubble-menu": 3.23.5
  "@tiptap/extension-bullet-list": 3.23.5
  "@tiptap/extension-code": 3.23.5
  "@tiptap/extension-code-block": 3.23.5
  "@tiptap/extension-document": 3.23.5
  "@tiptap/extension-dropcursor": 3.23.5
  "@tiptap/extension-floating-menu": 3.23.5
  "@tiptap/extension-gapcursor": 3.23.5
  "@tiptap/extension-hard-break": 3.23.5
  "@tiptap/extension-heading": 3.23.5
  "@tiptap/extension-horizontal-rule": 3.23.5
  "@tiptap/extension-italic": 3.23.5
  "@tiptap/extension-list": 3.23.5
  "@tiptap/extension-list-item": 3.23.5
  "@tiptap/extension-list-keymap": 3.23.5
  "@tiptap/extension-ordered-list": 3.23.5
  "@tiptap/extension-paragraph": 3.23.5
  "@tiptap/extension-strike": 3.23.5
  "@tiptap/extension-text": 3.23.5
  "@tiptap/extensions": 3.23.5
# EV host module (#801, EV ADR-0014): @eqv/* tarballs pack @ap/* as exact SDK peers (0.15.0); this workspace provides them as workspace:* (0.0.0).
peerDependencyRules:
  allowedVersions:
    "@eqv/*>@ap/ui": "*"
    "@eqv/*>@ap/contracts": "*"
