# Same-origin edge for the production stack (#1266 b1d). Installed as the nginx image template
# /etc/nginx/templates/default.conf.template and rendered to /etc/nginx/conf.d/default.conf (http context) at start;
# envsubst replaces only ${PUBLIC_ATTACHMENT_ORIGIN} (NGINX_ENVSUBST_FILTER in the Dockerfile), nginx variables stay.
# Topology: company TLS ingress -> this edge (plain HTTP) -> backend:3001. TLS is the ingress's job.
# Static test: ops/platform-api/edge/nginx.test.mjs (route order, no error interception on proxied locations).

server_tokens off;

# Access log: path only. Never $request, $args, $request_uri or $http_referer: OIDC callback and other URLs carry
# credentials in the query string. $uri is the (normalized) path; for /api/features/ it is logged after the prefix strip.
log_format edge_safe '$time_iso8601 client=$remote_addr xff="$http_x_forwarded_for" $request_method $uri '
                     'status=$status bytes=$body_bytes_sent rt=$request_time cid="$http_x_correlation_id"';

# Hashed assets are cached for a year only when the response succeeded; a missing asset (404) gets no cache header.
map $status $asset_cache_control {
    default "";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Overrides the image's http-level access_log (which uses the full-request "main" format).
    access_log /var/log/nginx/access.log edge_safe;

    # Redirects nginx generates itself (e.g. /api/features -> /api/features/) stay relative: this hop is plain HTTP
    # behind the TLS ingress, so an absolute Location would downgrade the client to http.
    absolute_redirect off;
    port_in_redirect off;

    # Document security policy: same as the backend's Helmet (apps/platform-api/src/server.ts) for HTML and static files.
    # add_header is not inherited into a location that declares its own, so each document location repeats these.
    # Proxied /api and /auth locations set none: the backend owns those headers.
    set $document_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ${PUBLIC_ATTACHMENT_ORIGIN}; font-src 'self' data:; connect-src 'self' ${PUBLIC_ATTACHMENT_ORIGIN}; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; script-src-attr 'none'; upgrade-insecure-requests";

    # 25 MiB attachment limit (MAX_ATTACHMENT_BYTES) + multipart overhead. The generic upload route below raises it for itself only.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve the backend per request through Docker's embedded DNS so a recreated backend container (new IP) needs
    # no edge restart. The upstream is a variable, so proxy_pass below carries no URI and forwards the request URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:3001;

    # Proxy settings shared by every backend location. Host, cookies and X-Correlation-Id pass unchanged.
    # X-Forwarded-Proto is the ingress's value (never $scheme: this hop is HTTP); X-Forwarded-For is appended to.
    # With TRUSTED_PROXY_HOPS=2 the backend then takes the client address the ingress saw.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Above the backend's 30 s HTTP_REQUEST_TIMEOUT_MS so the backend's own timeout response reaches the client.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # Uploads stream to the backend instead of being spooled to the edge's disk first (the backend bounds the size).
    proxy_request_buffering off;

    # 0. Generic file upload (POST /api/v1/platform/files, ADR-0140): 32 MiB + multipart overhead, and 1 MiB of headroom so a
    # file one byte over the limit still reaches the backend and gets its judged `too_large` answer instead of an nginx 413.
    # Every other /api/ route keeps the 26m above. An exact match, so it wins over the prefix locations.
    location = /api/v1/platform/files {
        client_max_body_size 34m;
        proxy_pass http://$backend_upstream;
    }

    # 1. Feature API: strip /api/features and forward (platform ADR-0071; mirrors apps/platform-web/scripts/real-dev-proxy.ts).
    location ^~ /api/features/ {
        rewrite ^/api/features/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
    }

    # 2. Platform API and auth: forwarded unchanged. Backend 4xx/5xx JSON passes through untouched
    # (no error_page, no proxy_intercept_errors: never SPA HTML for /api or /auth).
    location ^~ /api/ {
        proxy_pass http://$backend_upstream;
    }

    # Query strings on /auth/ (OIDC code and state) must not reach nginx error lines either: only crit+ is logged here.
    location ^~ /auth/ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://$backend_upstream;
    }

    # 3. Hashed build assets: immutable. A missing asset is a 404, never index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $asset_cache_control;
        add_header Content-Security-Policy $document_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 4. index.html is never cached, so a new release is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $document_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 5. Everything else: static file, else the SPA entry (deep links).
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy $document_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
