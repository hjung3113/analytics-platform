# Same-origin edge for the production stack (#1266 b1d). Loaded as /etc/nginx/conf.d/default.conf (http context).
# Topology: company TLS ingress -> this edge (plain HTTP) -> backend:3001. TLS is the ingress's job.
# Static test: ops/platform-api/edge/nginx.test.mjs (route order, no error interception on proxied locations).

server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 25 MiB attachment limit (MAX_ATTACHMENT_BYTES) + multipart overhead.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve the backend per request through Docker's embedded DNS so a recreated backend container (new IP) needs
    # no edge restart. The upstream is a variable, so proxy_pass below carries no URI and forwards the request URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:3001;

    # Proxy settings shared by every backend location. Host, cookies and X-Correlation-Id pass unchanged.
    # X-Forwarded-Proto is the ingress's value (never $scheme: this hop is HTTP); X-Forwarded-For is appended to.
    # With TRUSTED_PROXY_HOPS=2 the backend then takes the client address the ingress saw.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Above the backend's 30 s HTTP_REQUEST_TIMEOUT_MS so the backend's own timeout response reaches the client.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # Uploads stream to the backend instead of being spooled to the edge's disk first (the backend bounds the size).
    proxy_request_buffering off;

    # 1. Feature API: strip /api/features and forward (ADR-0071; mirrors apps/platform-web/scripts/real-dev-proxy.ts).
    location ^~ /api/features/ {
        rewrite ^/api/features/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
    }

    # 2. Platform API and auth: forwarded unchanged. Backend 4xx/5xx JSON passes through untouched
    # (no error_page, no proxy_intercept_errors: never SPA HTML for /api or /auth).
    location ^~ /api/ {
        proxy_pass http://$backend_upstream;
    }

    location ^~ /auth/ {
        proxy_pass http://$backend_upstream;
    }

    # 3. Hashed build assets: immutable. A missing asset is a 404, never index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 4. index.html is never cached, so a new release is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 5. Everything else: static file, else the SPA entry (deep links).
    location / {
        try_files $uri /index.html;
    }
}
