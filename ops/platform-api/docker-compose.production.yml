name: platform-api
# PRODUCTION stack (#1266 b1b): real OIDC only, NODE_ENV=production, no fixtures, no mock IdP, no test seed path.
# docker-compose.release.yml is the LOCAL SMOKE stack (mock IdP, development mode); never deploy it. Run
# scripts/release/production-preflight.sh <env-file> first: it rejects placeholder/demo secrets and non-https OIDC.
# Order on a new volume (details: docs/architecture/platform-api/release/oidc-and-images.md "Production stack"):
#   docker compose --env-file .env.production -f docker-compose.production.yml run --rm set-role-passwords
#   docker compose --env-file .env.production -f docker-compose.production.yml run --rm cutover
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d
#   docker compose --env-file .env.production -f docker-compose.production.yml run --rm bootstrap
#   docker compose --env-file .env.production -f docker-compose.production.yml restart backend   # registers the 「플랫폼」 and business systems (#1289 node i)
#   docker compose --env-file .env.production -f docker-compose.production.yml run --rm set-actor-role --external-id <sub> --role admin
# The backend never receives DATABASE_URL_MIGRATE or the postgres superuser password; only the job services do.
# Role passwords come from PLATFORM_APP_DB_PASSWORD / PLATFORM_MIGRATE_DB_PASSWORD; set-role-passwords applies them (also
# for rotation). Only the `edge` service is published (EDGE_BIND:EDGE_PORT); build its image first with
# scripts/release/build-web-image.sh (platform-release-web:local, never pulled or built here).

# Ownership marker, as in the smoke stack: operators leave RELEASE_OWNER unset (`operator`).
x-ownership: &ownership
  platform.release.owner: ${RELEASE_OWNER:-operator}

# Bounded container logs on every service (OPS-13).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    labels: *ownership
    logging: *logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - release-postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/10-platform-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g

  migrate:
    labels: *ownership
    logging: *logging
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    restart: "no"
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://platform_app:${PLATFORM_APP_DB_PASSWORD:?set PLATFORM_APP_DB_PASSWORD in .env.production}@postgres:5432/platform
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:${PLATFORM_MIGRATE_DB_PASSWORD:?set PLATFORM_MIGRATE_DB_PASSWORD in .env.production}@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  # Job-only (profile): the postgres superuser credential exists only in this one-off container.
  cutover:
    labels: *ownership
    logging: *logging
    profiles: ["cutover"]
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    restart: "no"
    command: ["bash", "/workspace/ops/platform-api/scripts/db/cutover-0076-platform-identity.sh", "all"]
    environment:
      CUTOVER_ADMIN_URL: postgresql://postgres@postgres:5432/postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:${PLATFORM_MIGRATE_DB_PASSWORD:?set PLATFORM_MIGRATE_DB_PASSWORD in .env.production}@postgres:5432/platform
      # A fresh volume still holds the fops_* replay logins until the cutover renames them.
      CUTOVER_OLD_MIGRATE_URL: postgresql://fops_migrate:${PLATFORM_MIGRATE_DB_PASSWORD:?set PLATFORM_MIGRATE_DB_PASSWORD in .env.production}@postgres:5432/platform
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  # Job-only (profile roles): sets the app and migrate login passwords from the env file (first provisioning and
  # every rotation; idempotent). Run it BEFORE the cutover on a new volume. Holds the superuser credential like cutover.
  set-role-passwords:
    labels: *ownership
    logging: *logging
    profiles: ["roles"]
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    restart: "no"
    entrypoint: ["bash", "/workspace/ops/platform-api/scripts/db/set-role-passwords.sh"]
    environment:
      ROLE_PASSWORDS_ADMIN_URL: postgresql://postgres@postgres:5432/postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?set PLATFORM_APP_DB_PASSWORD in .env.production}
      PLATFORM_MIGRATE_DB_PASSWORD: ${PLATFORM_MIGRATE_DB_PASSWORD:?set PLATFORM_MIGRATE_DB_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  # Job-only (profile bootstrap): creates the Workspace and the `system` Actor, nothing else. Idempotent.
  bootstrap:
    labels: *ownership
    logging: *logging
    profiles: ["bootstrap"]
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    restart: "no"
    command: ["node_modules/.bin/tsx", "src/seed/index.ts"]
    environment:
      SEED_MODE: bootstrap
      DATABASE_URL: postgresql://platform_app:${PLATFORM_APP_DB_PASSWORD:?set PLATFORM_APP_DB_PASSWORD in .env.production}@postgres:5432/platform
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:${PLATFORM_MIGRATE_DB_PASSWORD:?set PLATFORM_MIGRATE_DB_PASSWORD in .env.production}@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.production}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Platform}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 768m

  # Job-only (profile admin): `docker compose run --rm set-actor-role --external-id <sub> --role admin [--reason <text>]`.
  set-actor-role:
    labels: *ownership
    logging: *logging
    profiles: ["admin"]
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    restart: "no"
    entrypoint: ["/usr/local/bin/migrate-entrypoint", "node_modules/.bin/tsx", "src/cli/set-actor-role.ts"]
    environment:
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:${PLATFORM_MIGRATE_DB_PASSWORD:?set PLATFORM_MIGRATE_DB_PASSWORD in .env.production}@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  minio:
    labels: *ownership
    logging: *logging
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}
    volumes:
      - release-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  minio-bootstrap:
    labels: *ownership
    logging: *logging
    image: platform-release-backend:local
    restart: "no"
    entrypoint: ["node"]
    command: ["dist/cli/storage-bootstrap.js"]
    environment:
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-platform-attachments}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 256m

  backend:
    labels: *ownership
    logging: *logging
    image: platform-release-backend:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
    restart: unless-stopped
    # server.ts bounds shutdown at 40 s (#1269); leave headroom before SIGKILL.
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      AUTH_PROVIDER: oidc
      DATABASE_URL: postgresql://platform_app:${PLATFORM_APP_DB_PASSWORD:?set PLATFORM_APP_DB_PASSWORD in .env.production}@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.production}
      # Empty or unset keeps the image default (the file baked into the image); never an empty value.
      PLATFORM_SYSTEMS_FILE: ${PLATFORM_SYSTEMS_FILE:-/app/platform-systems.json}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set the https OIDC issuer in .env.production}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env.production}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env.production}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?set the https platform host /auth/callback URL in .env.production}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:?set TRUSTED_PROXY_HOPS (>=1) in .env.production}
      PUBLIC_ATTACHMENT_ORIGIN: ${PUBLIC_ATTACHMENT_ORIGIN:-'self'}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_ACQUIRE_TIMEOUT_MS: ${DB_POOL_ACQUIRE_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-platform-attachments}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.production}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      NOTIFICATION_EMAIL_CHANNEL: ${NOTIFICATION_EMAIL_CHANNEL:?set mock or smtp in .env.production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    # Readiness (database, pg-boss, storage; 503 while draining) so dependents such as the edge wait on
    # service_healthy. The image keeps its own HEALTHCHECK on /health/live for runs outside compose.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 1g

  # Same-origin edge: nginx serving the prebuilt real web bundle, /api and /auth proxied to the backend (#1266 b1d).
  # The image comes only from scripts/release/build-web-image.sh (it needs the prebuilt dist), so there is no build: key
  # and compose fails with "image not found" when the script was not run. TLS terminates at the company ingress in front.
  edge:
    labels: *ownership
    logging: *logging
    image: platform-release-web:local
    pull_policy: never
    restart: unless-stopped
    environment:
      # Same value the backend's CSP uses; rendered into the edge's document CSP at container start.
      PUBLIC_ATTACHMENT_ORIGIN: ${PUBLIC_ATTACHMENT_ORIGIN:-'self'}
    ports:
      - "${EDGE_BIND:?set EDGE_BIND to the interface only the company ingress reaches in .env.production}:${EDGE_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    mem_limit: 256m

volumes:
  # Same pinned names as docker-compose.release.yml: an existing install keeps its data (see "Existing installs: data
  # volumes" in docs/architecture/platform-api/release/oidc-and-images.md). Override per install when needed.
  release-postgres-data:
    labels: *ownership
    name: ${RELEASE_POSTGRES_VOLUME:-feedbackops-release-1060_release-postgres-data}
  release-minio-data:
    labels: *ownership
    name: ${RELEASE_MINIO_VOLUME:-feedbackops-release-1060_release-minio-data}
