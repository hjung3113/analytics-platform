# Local Postgres, MinIO and optional Keycloak for platform API development and integration tests.
#
# Usage on a NEW volume (run from ops/platform-api). init.sql creates database `platform` and the replay bootstrap
# roles fops_* with the final dev passwords; the cutover replays history as fops_migrate, renames the roles to
# platform_* with an admin connection, then runs the ordinary platform_migrate migration:
#   docker compose -f docker-compose.dev.yml up -d
#   # The final non-admin URLs stay in your shell: the cutover (as platform_migrate), the seed and later migrations use them.
#   export DATABASE_URL='postgres://platform_app:platform_app@localhost:5434/platform'
#   export DATABASE_URL_MIGRATE='postgres://platform_migrate:platform_migrate@localhost:5434/platform'
#   (  # a subshell: the superuser URL and the dev opt-in must not leak into the later seed/server commands
#     export CUTOVER_ADMIN_URL='postgres://postgres:postgres@localhost:5434/postgres'
#     export CUTOVER_ALLOW_DEV_DB=1   # 5434 is the developer database: a deliberate opt-in
#     bash scripts/db/cutover-0076-platform-identity.sh all
#   )
#   pnpm --filter @ap/platform-api db:seed
# Later migrations need no admin login: pnpm --filter @ap/platform-api db:migrate (as platform_migrate).
# A pre-existing local volume still holds the old `feedbackops` database and fops_* roles: see
# apps/platform-api/docs/04-database-and-migrations.md, "Local developer database recreation".
#
# Why two roles: FO ADR-0008 requires that the application role cannot UPDATE or
# DELETE rows in core.audit_log. The container initialises both roles up front;
# per-table GRANT/REVOKE is owned by the migration SQL.

name: platform-api

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # We deliberately do NOT set POSTGRES_DB; the init script creates the
      # `platform` database owned by fops_migrate until the 0076 cutover
      # renames the role to platform_migrate, so the migration role has DDL
      # on its own DB without piggybacking on the superuser.
    ports:
      # Host 5434 -> container 5432 avoids clashing with a system-installed
      # local Postgres on the default port. Both DATABASE_URL and
      # DATABASE_URL_MIGRATE in docs should reference :5434.
      - '5434:5432'
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - platform-db-data:/var/lib/postgresql/data
    # Parallel queries (knowledge search runs them) keep their hash and sort segments in /dev/shm. Docker's 64 MB default
    # failed 243-268 of 3,000 search requests with «could not resize shared memory segment … No space left on device»
    # at 30 clients (#1599). 256m is sized as the pool (DB_POOL_MAX 10) times about 24 MB per parallel query (2 workers
    # + leader, work_mem 4 MB x hash_mem_multiplier 2); it is charged to the container memory limit, not added to it.
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20

  # MinIO: S3-compatible object store for attachment storage (#22, FO ADR-0011 amended).
  # Console: http://localhost:9001  |  S3 API: http://localhost:9000
  # Bootstrap the bucket once with:
  #   pnpm --filter @ap/platform-api exec tsx src/cli/storage-bootstrap.ts
  minio:
    # The one publicly pullable copy of the site's image (#1617). entrypoint and root: see docker-compose.production.yml.
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2024.7.16-debian-12-r0}
    container_name: platform-minio
    entrypoint: ['minio']
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform-minio
      MINIO_ROOT_PASSWORD: platform-minio-secret-change-me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  # Keycloak as the interim OIDC IdP (#603). Opt in with `--profile auth`; the default
  # `docker compose up` does not start it. Runbook: ops/platform-api/docs/release/keycloak-interim-idp.md
  keycloak:
    profiles: ['auth']
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: platform-keycloak
    command: start-dev --import-realm
    mem_limit: 1g
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Realm placeholders (deploy/keycloak/platform-realm.json), local defaults.
      KC_ALLOWED_EMAIL_PATTERN: '^[^@]+@example[.]com$'
      PLATFORM_API_CLIENT_SECRET: local-dev-secret
      PLATFORM_API_REDIRECT_URI: http://localhost:3011/auth/callback
      PLATFORM_API_WEB_ORIGIN: http://localhost:3011
      KC_SMTP_HOST: mailpit
      KC_SMTP_PORT: '1025'
      KC_SMTP_FROM: platform@example.com
      KC_REALM_FRONTEND_URL: http://localhost:8085
    # Loopback only: a local IdP with admin/admin must not be reachable from the network.
    ports:
      - '127.0.0.1:8085:8080'
    volumes:
      - ./deploy/keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
    depends_on:
      - mailpit

  # Mailpit: catches Keycloak's verification mail locally. UI http://localhost:8025 (loopback only);
  # Keycloak reaches its SMTP port 1025 on the compose network, so that port is not published.
  mailpit:
    profiles: ['auth']
    image: axllent/mailpit:v1.31.3
    container_name: platform-mailpit
    mem_limit: 256m
    ports:
      - '127.0.0.1:8025:8025'

volumes:
  # Data identity, not a name to tidy: the project was `feedbackops` (volume `feedbackops_feedbackops-db-data`). The
  # volume is pinned so a project rename (#1100 b) mounts the existing database instead of provisioning a blank one.
  # Override only to deliberately point at another volume: PLATFORM_API_DB_VOLUME=<name> docker compose ... up -d
  platform-db-data:
    name: ${PLATFORM_API_DB_VOLUME:-feedbackops_feedbackops-db-data}
