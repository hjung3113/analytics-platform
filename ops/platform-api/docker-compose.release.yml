name: platform-api
# LOCAL SMOKE stack (mock OIDC provider, NODE_ENV=development, fixtures allowed). Never deploy it; the production stack is
# docker-compose.production.yml (real OIDC only, no fixtures).
# DB identity (#1100 a): scripts/db/init.sql creates database `platform` and the replay bootstrap roles (fops_*, with
# the final dev passwords). Run the job-only `cutover` service once on a new volume, BEFORE the `migrate` service:
#   docker compose --project-name platform-api --env-file .env.release -f docker-compose.release.yml run --rm cutover
# (scripts/release/image-smoke.sh does this). Plain drizzle-kit migrate as platform_migrate fails closed until the
# roles are renamed; afterwards `migrate` is the only migration path and needs no admin credential.

# Ownership marker: every container and volume carries `platform.release.owner`. Operators leave RELEASE_OWNER unset
# (`operator`); scripts/release/image-smoke.sh exports `smoke` and refuses a project that holds anything not marked
# `smoke`, so it can never build, start or remove an operator stack that shares its project name.
x-ownership: &ownership
  platform.release.owner: ${RELEASE_OWNER:-operator}

# Bounded container logs on every service (OPS-13), same anchor as docker-compose.production.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    labels: *ownership
    logging: *logging
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_parameter_max_length=0"
      - "-c"
      - "log_parameter_max_length_on_error=0"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.release.example to .env.release}
    volumes:
      - release-postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/10-platform-init.sql:ro
    # Parallel queries (knowledge search runs them) keep their hash and sort segments in /dev/shm. Docker's 64 MB default
    # failed 243-268 of 3,000 search requests with «could not resize shared memory segment … No space left on device»
    # at 30 clients (#1599). 256m is sized as the pool (DB_POOL_MAX 10) times about 24 MB per parallel query (2 workers
    # + leader, work_mem 4 MB x hash_mem_multiplier 2); it is charged to the container memory limit, not added to it.
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g

  oidc:
    labels: *ownership
    logging: *logging
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"subject","match":".*","claims":{"sub":"$${subject}","email":"$${subject}@example.local","email_verified":true,"name":"$${subject}"}}]}]}
    ports:
      - "${RELEASE_OIDC_PORT:-8080}:8080"
      - "${RELEASE_BACKEND_PORT:-3001}:3001"
    mem_limit: 512m

  migrate:
    labels: *ownership
    logging: *logging
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://platform_app:platform_app@postgres:5432/platform
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:platform_migrate@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.release}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  # Job-only, never started by `up` (profile). The postgres superuser credential exists only in this one-off container,
  # in the Postgres network; backend and migrate never receive it. The password is not placed in the URL (it may hold
  # URL-reserved characters): libpq reads it from PGPASSWORD, set here only. In-network on purpose: the release
  # Postgres has no published host port. Same image as `migrate`.
  cutover:
    labels: *ownership
    logging: *logging
    profiles: ["cutover"]
    image: platform-release-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    command: ["bash", "/workspace/ops/platform-api/scripts/db/cutover-0076-platform-identity.sh", "all"]
    environment:
      CUTOVER_ADMIN_URL: postgresql://postgres@postgres:5432/postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.release.example to .env.release}
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:platform_migrate@postgres:5432/platform
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  minio:
    labels: *ownership
    logging: *logging
    # Set per site (#1617, docs/release/run-guide.md «MinIO 이미지»): a local image is used, otherwise a normal pull runs.
    # The Bitnami image needs `entrypoint` (its own script would exec `server`) and root (the named volume at /data is
    # root-owned and its default user 1001 cannot write it). The upstream minio/minio image also ran as root.
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in .env.release}
    entrypoint: ["minio"]
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.release}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.release}
    volumes:
      - release-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  minio-bootstrap:
    labels: *ownership
    logging: *logging
    image: platform-release-backend:local
    entrypoint: ["node"]
    command: ["dist/cli/storage-bootstrap.js"]
    environment:
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-platform-attachments}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.release}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.release}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 256m

  backend:
    labels: *ownership
    logging: *logging
    image: platform-release-backend:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
    network_mode: service:oidc
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      AUTH_PROVIDER: oidc
      DATABASE_URL: postgresql://platform_app:platform_app@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.release}
      OIDC_ISSUER_URL: http://localhost:8080/default
      OIDC_CLIENT_ID: platform-release-local
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env.release}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the retained platform host /auth/callback URL}
      OIDC_SCOPES: openid email profile
      TRUSTED_PROXY_HOPS: "1"
      PUBLIC_ATTACHMENT_ORIGIN: "'self'"
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-platform-attachments}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.release}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.release}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      oidc:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 1g

volumes:
  # Data identity (#1100 b): the project was `feedbackops-release-1060`, so an existing install keeps its data in
  # `feedbackops-release-1060_release-postgres-data` and `..._release-minio-data`. Both are pinned by name so the
  # project rename above mounts them instead of provisioning blank volumes. Select each one explicitly when the
  # existing install used another project name (<old-project>_release-postgres-data / _release-minio-data):
  #   RELEASE_POSTGRES_VOLUME=<old-project>_release-postgres-data RELEASE_MINIO_VOLUME=<old-project>_release-minio-data
  # scripts/release/image-smoke.sh always overrides both with volumes it owns and never mounts these.
  # The default project is `platform-api` (ADR-0097), which is also the development project of docker-compose.dev.yml.
  # To run both at once, give ONE of them another project: RELEASE_PROJECT_NAME=<name> (and --project-name <name>).
  release-postgres-data:
    labels: *ownership
    name: ${RELEASE_POSTGRES_VOLUME:-feedbackops-release-1060_release-postgres-data}
  release-minio-data:
    labels: *ownership
    name: ${RELEASE_MINIO_VOLUME:-feedbackops-release-1060_release-minio-data}
