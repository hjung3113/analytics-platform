name: feedbackops-release-1060
# DB identity (#1100 a): scripts/db/init.sql creates database `platform` and the replay bootstrap roles (fops_*, with
# the final dev passwords). Run the job-only `cutover` service once on a new volume, BEFORE the `migrate` service:
#   docker compose --project-name feedbackops-release-1060 --env-file .env.release -f docker-compose.release.yml run --rm cutover
# (scripts/release/image-smoke.sh does this). Plain drizzle-kit migrate as platform_migrate fails closed until the
# roles are renamed; afterwards `migrate` is the only migration path and needs no admin credential.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.release.example to .env.release}
    volumes:
      - release-postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/10-feedbackops-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"subject","match":".*","claims":{"sub":"$${subject}","email":"$${subject}@example.local","email_verified":true,"name":"$${subject}"}}]}]}
    ports:
      - "${RELEASE_OIDC_PORT:-8080}:8080"
      - "${RELEASE_BACKEND_PORT:-3001}:3001"
    mem_limit: 512m

  migrate:
    image: feedbackops-release-1060-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://platform_app:platform_app@postgres:5432/platform
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:platform_migrate@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.release}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  # Job-only, never started by `up` (profile). The postgres superuser credential exists only in this one-off container,
  # in the Postgres network; backend and migrate never receive it. The password is not placed in the URL (it may hold
  # URL-reserved characters): libpq reads it from PGPASSWORD, set here only. In-network on purpose: the release
  # Postgres has no published host port. Same image as `migrate`.
  cutover:
    profiles: ["cutover"]
    image: feedbackops-release-1060-migrate:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
      target: migrate
    command: ["bash", "/workspace/ops/platform-api/scripts/db/cutover-0076-platform-identity.sh", "all"]
    environment:
      CUTOVER_ADMIN_URL: postgresql://postgres@postgres:5432/postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.release.example to .env.release}
      DATABASE_URL_MIGRATE: postgresql://platform_migrate:platform_migrate@postgres:5432/platform
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.release}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.release}
    volumes:
      - release-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  minio-bootstrap:
    image: feedbackops-release-1060-backend:local
    entrypoint: ["node"]
    command: ["dist/cli/storage-bootstrap.js"]
    environment:
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-fops-attachments}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.release}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.release}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 256m

  backend:
    image: feedbackops-release-1060-backend:local
    build:
      context: ../..
      dockerfile: apps/platform-api/Dockerfile
    network_mode: service:oidc
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      AUTH_PROVIDER: oidc
      DATABASE_URL: postgresql://platform_app:platform_app@postgres:5432/platform
      WORKSPACE_ID: ${WORKSPACE_ID:?set WORKSPACE_ID in .env.release}
      OIDC_ISSUER_URL: http://localhost:8080/default
      OIDC_CLIENT_ID: feedbackops-release-local
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env.release}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the retained platform host /auth/callback URL}
      OIDC_SCOPES: openid email profile
      TRUSTED_PROXY_HOPS: "1"
      PUBLIC_ATTACHMENT_ORIGIN: "'self'"
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-fops-attachments}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.release}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.release}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      oidc:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 1g

volumes:
  release-postgres-data:
  release-minio-data:
