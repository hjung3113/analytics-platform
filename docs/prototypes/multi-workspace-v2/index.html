function render(){renderRail();renderSidebar();renderTopbar();let content='';if(state.app==='portal')content=portal();else if(state.app==='hub')content=feedbackPage(true);else if(state.page.startsWith('fb-'))content=feedbackPage(false);else if(state.app==='analytics')content=analyticsPage();else if(state.app==='metrics')content=metricPage();else if(state.app==='logs')content=logsPage();else if(state.app==='improve')content=improvePage();else content=opsPage();document.getElementById('content').innerHTML=(state.returnPath?`<div class="returnBar">${i('back','sm')} 다른 시스템에서 이동했습니다. <button onclick="doReturn()">${label(state.returnPath.app)} / 이전 화면으로 돌아가기</button><span class="rightAligned">관련 컨텍스트는 참조로 전달되며 자동 검색 필터는 아닙니다.</span></div>`:'')+content;renderDetail()}
function header(eyebrow,title,desc,actions=''){return `<div class="titleRow"><div><div class="eyebrow">${eyebrow}</div><h1 class="pageTitle">${title}</h1><p class="pageDesc">${desc}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`}
function stat(title,value,detail,tone=''){return `<div class="stat"><div class="small">${title}</div><strong>${value}</strong><div class="statFoot ${tone}">${detail}</div></div>`}
function statGroup(items){return `<div class="stats">${items.map(it=>stat(...it)).join('')}</div>`}
function panel(title,subtitle,body,action=''){return `<section class="panel"><div class="panelHead"><div><h3>${title}</h3>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div>${body}</section>`}
function context(labels){return `<div class="context">${i('layers','sm')}<b>이 시스템의 작업 컨텍스트</b><em>│</em>${labels.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tail">다른 시스템으로 이동하면 지원되는 값만 명시적으로 전달</span></div>`}
function tTable(headers,rows){return `<div class="tableWrap"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function appCard(id){const a=apps[id];return `<button class="appCard" onclick="navigate('${id}')"><div class="appCardHead"><span class="appCardIcon">${i(a.icon,'lg')}</span><div><strong>${a.title}</strong><small>${a.en}</small></div><span class="rightAligned">${i('arrow')}</span></div><p>${a.desc}</p><div class="appCardFooter"><span>${a.stats}</span><b>워크스페이스 열기 ${i('chevron','sm')}</b></div></button>`}

function logValidation(){return `${header('VALIDATION WORKBENCH','로그 검증 워크벤치','모델별 검사 Round를 확인하고 원문 근거와 결함을 추적하는 독립 작업 화면입니다.',`<button class="btn" onclick="openPage('defects')">${i('warning','sm')} 결함 목록</button><button class="btn primary" onclick="openDetail('새 검증 Round','VAL-NEW','검증 작업')">${i('plus','sm')} 검증 실행</button>`)}${context(['모델 CVD-300','Alpha','Round 04','검증일 2026.10.08'])}${statGroup([['검증 규칙','124','필수 Event · 순서 · Pairing'],['성공','116','정상 통과','success'],['실패','5','원문 근거 연결','warning'],['미확정','3','Parser 결과 확인 필요']])}${panel('검증 결과 상세','행을 선택하면 우측 근거 패널이 열립니다.',tTable(['검사 ID','검증 항목','판정','발견 건수','검증 대상',''],[['VAL-043','Process Start / End Pairing','실패',3,'Event Log'],['VAL-044','Wafer Transfer Sequence','실패',2,'Parser Raw Data'],['VAL-045','Recipe Field Presence','성공',0,'Event Log'],['VAL-046','Job Completion','성공',0,'Parsed Jobs']].map(([id,name,st,count,source])=>`<tr onclick="openDetail('${name}','${id}','검증 결과',{result:'${st}',defect:'${count}건',source:'${source}'})"><td class="monospace">${id}</td><td class="strong">${name}</td><td><span class="tag ${st==='성공'?'green':'red'}">${st}</span></td><td>${count}</td><td>${source}</td><td>${i('chevron','sm')}</td></tr>`)),`<button class="btn sm" onclick="openPage('defects')">결함 관리로 이동 ${i('arrow','sm')}</button>`)}<p class="pageDesc" style="margin-top:16px">이 시스템의 검증 결함은 FeedbackOps Task가 아닙니다. 시스템 자체의 결함 객체로 남기고, 필요한 경우 별도의 관련 Task에 연결합니다.</p>`}
function logVendor(){return `${header('VENDOR REVIEW','협력사 검토 · Excel 추출','설비사에 전달할 검토 내용을 관리하고 엑셀로 추출합니다. 보안메일 시스템과는 연동하지 않습니다.',`<button class="btn primary" onclick="downloadReview()">${i('download','sm')} 검토 결과 Excel용 CSV</button>`)}${context(['모델: CVD-300','Round 04','협력사: Vendor A'])}${panel('협력사 회신용 검토 목록','선택 후 내보내기 · 화면 수치는 예시',tTable(['결함 ID','검토 결과','상세 설명','조치 요청','우선순위',''],[['DEF-301','미충족','Process End Event 누락','로그 수정 요청','높음'],['DEF-302','미충족','Pairing 오류 발생','재검증 샘플 제출','높음'],['DEF-303','확인 중','선택 항목 형식 미준수','스펙 확인 요청','보통']].map(([id,status,desc,action,prior])=>`<tr onclick="openDetail('${desc}','${id}','협력사 검토')"><td class="monospace">${id}</td><td><span class="tag amber">${status}</span></td><td class="strong">${desc}</td><td>${action}</td><td>${prior}</td><td>${i('chevron','sm')}</td></tr>`)))}<div class="appHint" style="margin-top:15px">${i('lock','sm')} 파일 추출까지만 제공합니다. 보안메일 전송은 현재 별도 사내 시스템에서 수행하는 업무로 유지합니다.</div>`}

function opsPage(){if(state.page!=='overview'&&state.page!=='services'&&state.page!=='pipeline'&&state.page!=='failed')return secondaryPage('개발·운영','개발자 도구와 인프라 메뉴는 분석 메뉴와 별개로 관리합니다.','운영');return `${header('OPERATIONS WORKSPACE',state.page==='pipeline'?'데이터 파이프라인':state.page==='failed'?'실패 작업·재처리':'운영 서비스 상태','운영 메뉴 수가 늘어나도 독립 워크스페이스 사이드바 안에서 확장됩니다.',`<button class="btn" onclick="toast('새로고침 시연 완료 · 예시 데이터 유지')">${i('refresh','sm')} 새로고침</button>`)}${context(['환경: Production','기준 시각: 10:40','사이트: FAB1'])}${statGroup([['서비스','18','정상 17 · 점검 1'],['최근 1시간 작업','7,530','전체 파이프라인 배치'],['재처리 필요','4','처리 지연','warning'],['가용 상태','정상','API 응답 가능','success']])}${panel('애플리케이션 및 파이프라인 상태','실행 모니터링 · 서비스 상태',tTable(['서비스','담당 단계','최근 수행','상태','대기 작업',''],[['download-worker','FTP / Local 다운로드','10:39:52','정상','0'],['log-converter','표준 로그 변환','10:39:14','정상','18'],['standard-parser','Event → Raw Data','10:37:58','지연','43'],['db-loader','데이터 적재','10:39:41','정상','7'],['post-validation','사후 데이터 검증','10:36:10','정상','2']].map(([name,step,last,status,wait])=>`<tr onclick="openDetail('${name}','${name}','운영 서비스',{step:'${step}',last:'${last}',state:'${status}'})"><td class="strong monospace">${name}</td><td>${step}</td><td>${last}</td><td><span class="tag ${status==='정상'?'green':'amber'}">${status}</span></td><td>${wait}</td><td>${i('chevron','sm')}</td></tr>`)))}<div class="appHint" style="margin-top:15px">${i('shield','sm')} 이 워크스페이스는 개발자·운영자에게만 노출하는 별도 앱으로 설계합니다. 권한은 실제 백엔드에서 다시 확인해야 합니다.</div>`}
function secondaryPage(section,desc,kind){const a=apps[state.app];return `${header(a.en.toUpperCase(),currentTitle(),desc,`<button class="btn" onclick="openPage('overview')">${i('back','sm')} ${a.title} 개요</button>`)}${context([`시스템: ${a.title}`,`메뉴: ${currentTitle()}`])}<div class="panel" style="padding:30px 28px"><div style="width:46px;height:46px;display:grid;place-items:center;background:#e8effc;color:var(--blue);border-radius:10px">${i(a.icon,'lg')}</div><h3 style="font-size:18px;margin:18px 0 7px">${currentTitle()}</h3><p class="pageDesc" style="max-width:630px;line-height:1.8">이 메뉴는 <b>${a.title}</b> 워크스페이스가 소유합니다. 전용 API와 DB, 화면 구성은 유지하고, 공통 플랫폼의 Navigation과 FeedbackOps 인터페이스만 공유합니다.</p><div style="margin-top:23px;display:flex;gap:8px;flex-wrap:wrap"><span class="tag">독립 메뉴 그룹</span><span class="tag">시스템별 Context</span><span class="tag">별도 배포 가능</span><span class="tag">공통 Design System</span></div></div><div class="sectionTitle">해당 시스템의 협업</div>${panel('FeedbackOps 연결','같은 시스템 범위로 열린 요청과 작업',`<div style="padding:16px;display:flex;gap:9px"><button class="btn" onclick="openPage('fb-voc')">VOC ${a.feedback.voc}건 ${i('arrow','sm')}</button><button class="btn" onclick="openPage('fb-task')">Task ${a.feedback.task}건 ${i('arrow','sm')}</button><button class="btn" onclick="openPage('fb-survey')">설문 ${a.feedback.survey}건 ${i('arrow','sm')}</button></div>`)}`}
function allRecords(app,kind){const real=feedbackRecords[app]?.[kind]||[];const custom=(state.created[app]?.[kind]||[]);return [...custom,...real]}
function feedbackPage(hub){let app=hub?state.hubFilter:state.app;let kind=hub?state.hubKind:state.page.split('-')[1];if(kind==='survey'){return surveyPage(hub)}const titles={voc:'VOC',task:'Task'};let rows=[];for(const id of (hub?(app==='all'?appOrder:[app]):[app])){for(const r of allRecords(id,kind))rows.push({app:id,item:r})}let total=hub?rows.length:apps[app]?.feedback[kind]||rows.length;const tabs=hub?`<div class="tabbar">${[['voc','전체 VOC'],['task','전체 Task'],['survey','전체 설문']].map(([id,t])=>`<button class="tabbutton ${kind===id?'active':''}" onclick="state.hubKind='${id}';render()">${t}<span class="num">${id==='survey'?9:appOrder.reduce((n,a)=>n+apps[a].feedback[id],0)}</span></button>`).join('')}</div>`:`<div class="tabbar">${[['voc','VOC'],['task','Task'],['survey','설문']].map(([id,t])=>`<button class="tabbutton ${kind===id?'active':''}" onclick="openPage('fb-${id}')">${t}<span class="num">${apps[app].feedback[id]}</span></button>`).join('')}</div>`;
return `${header(hub?'FEEDBACKOPS · AGGREGATED':'FEEDBACKOPS · EMBEDDED',hub?`전체 시스템 ${titles[kind]} 관리`:`${label(app)} · ${titles[kind]} 관리`,hub?'모든 제품의 협업 업무를 시스템별로 구분해 보는 담당자용 통합 뷰입니다.':`이 화면은 ${label(app)} 시스템의 FeedbackOps 데이터만 보여줍니다. 다른 시스템 항목은 섞이지 않습니다.`,hub?'':`<button class="btn primary" onclick="openCreate('${kind}')">${i('plus','sm')} ${titles[kind]} 등록</button>`)}<div class="fbBanner"><span class="fbMark">F</span>${hub?`<strong>전체 협업 허브</strong> · 원본 데이터는 하나의 FeedbackOps 서비스에서 관리합니다. 시스템별 상태와 권한을 유지합니다.`:`<strong>관리 대상: ${label(app)}</strong> <span style="color:#8b97ac">/</span> FeedbackOps의 Managed System 범위를 이 시스템에 고정하여 조회하는 UI입니다.`}<span class="rightAligned">${i('shield','sm')} 시스템별 권한</span></div>${panel(hub?'통합 업무 목록':'이 시스템의 업무',hub?`전체 합계 ${total}건 (샘플 항목만 표기)`:`${label(app)}에 속한 ${titles[kind]} ${total}건`,`${tabs}<div class="toolbar"><div class="searchField">${i('search','sm')}<input id="feedback-filter-text" oninput="filterRows(this.value)" placeholder="번호 · 제목 검색" /></div>${hub?`<select class="formInput" style="width:194px;height:31px" onchange="state.hubFilter=this.value;render()"><option value="all" ${app==='all'?'selected':''}>모든 시스템</option>${appOrder.map(id=>`<option value="${id}" ${app===id?'selected':''}>${label(id)}</option>`).join('')}</select>`:`<span class="tag blue">${label(app)} 전용</span>`}<span class="tag gray">데모 데이터</span></div><div id="feedback-rows">${tTable(kind==='voc'?['ID','제목',...(hub?['대상 시스템']:[]),'접수 상태','우선순위','담당 영역','']:['ID','제목',...(hub?['대상 시스템']:[]),'작업 상태','담당자','기한',''],rows.map(({app:id,item:r})=>`<tr class="feedback-row" data-search="${escapeHtml((r[0]+' '+r[1]).toLowerCase())}" onclick="openDetail('${escapeHtml(r[1]).replace(/'/g,'&#39;')}','${r[0]}','${kind==='voc'?'VOC':'FeedbackOps Task'}',{scope:'${label(id)}',status:'${r[2]}'})"><td class="monospace">${r[0]}</td><td class="strong">${escapeHtml(r[1])}</td>${hub?`<td><span class="tag">${label(id)}</span></td>`:''}<td><span class="tag ${r[2]==='접수됨'?'cyan':r[2]==='진행 중'?'blue':r[2]==='처리 중'?'green':'gray'}">${r[2]}</span></td><td>${r[3]}</td><td>${r[4]}</td><td>${i('chevron','sm')}</td></tr>`))}</div>`,`<span class="tag gray">${hub?'All systems':'Managed System: '+label(app)}</span>`)}<p class="pageDesc" style="margin-top:15px">※ 실제 연동 시 화면의 시스템별 범위는 FeedbackOps의 Managed System 식별자로 매핑하고, 백엔드 권한을 기준으로 제한해야 합니다. 두 시스템의 객체를 하나로 병합하지 않습니다.</p>`}
function filterRows(value){const q=value.trim().toLowerCase();document.querySelectorAll('#feedback-rows tbody .feedback-row').forEach(el=>el.style.display=el.dataset.search.includes(q)?'':'none')}
function surveyPage(hub){const app=state.app==='hub'?state.hubFilter:state.app;return `${header(hub?'FEEDBACKOPS · AGGREGATED':'FEEDBACKOPS · EMBEDDED',hub?'전체 시스템 설문 현황':`${label(app)} · 설문`,hub?'전체 관리자는 시스템별 설문 응답 현황을 확인할 수 있습니다.':'현재 선택한 시스템에 속한 설문만 관리합니다.')}${hub?`<div class="fbBanner">${i('feedback','sm')} 전체 시스템을 범위로 한 설문 통합 관리 (샘플)</div>`:`<div class="fbBanner">${i('feedback','sm')} ${label(app)}의 FeedbackOps 설문 · 응답 · 결과</div>`}${panel('설문·응답 현황','시스템 범위별 설문 객체',tTable(['설문 ID','대상 시스템','설문 제목','응답','상태',''],(hub?appOrder:[app]).map((id,index)=>`<tr onclick="openDetail('${label(id)} 사용성 설문','SUR-${210+index}','설문',{scope:'${label(id)}',respondents:'${38+index*12}명'})"><td class="monospace">SUR-${210+index}</td><td>${label(id)}</td><td class="strong">${label(id)} 사용성 설문</td><td>${38+index*12}명</td><td><span class="tag ${index%2?'green':'blue'}">${index%2?'종료':'진행 중'}</span></td><td>${i('chevron','sm')}</td></tr>`)))}<p class="pageDesc" style="margin-top:12px">※ 설문 내용·응답과 VOC·Task는 FeedbackOps가 관리하며, 시스템별 화면은 동일한 API를 범위만 달리하여 사용합니다.</p>`}
function renderDetail(){const el=document.getElementById('detail');if(!state.detail){el.classList.add('hidden');el.innerHTML='';return}const d=state.detail;el.classList.remove('hidden');const meta=Object.entries(d.meta||{}).map(([k,v])=>`<div class="field"><div class="k">${({model:'모델',jobs:'Job 수',p95:'P95',grain:'단위·집계',version:'버전',usage:'사용처',vendor:'제조사',round:'검증 Round',defect:'결함 수',result:'결과',source:'원천',target:'적용 대상',step:'파이프라인 단계',last:'수행 시각',state:'상태',scope:'대상 시스템',status:'업무 상태',respondents:'응답 인원'})[k]||k}</div><div class="v">${escapeHtml(v)}</div></div>`).join('');el.innerHTML=`<div class="detailTop"><span class="tag blue">${escapeHtml(d.kind)}</span><button class="quietButton" onclick="state.detail=null;renderDetail()">${i('close')} 닫기</button></div><div class="detailBody"><div class="eyebrow">DETAIL PANEL</div><h2 class="detailTitle">${escapeHtml(d.title)}</h2><div style="display:flex;gap:7px"><span class="tag">${escapeHtml(d.id)}</span><span class="tag">${label(d.app==='hub'?(d.meta.scope?Object.keys(apps).find(x=>label(x)===d.meta.scope):'analytics'):d.app)}</span></div><div class="detailSub">기본 정보</div><div class="field"><div class="k">식별자</div><div class="v monospace">${escapeHtml(d.id)}</div></div>${meta}<div class="detailSub">이 화면에 관하여</div><p class="detailPara">독립 워크스페이스의 데이터를 조회하는 우측 상세 패널입니다. 현재 업무 컨텍스트를 유지하며 항목을 탐색할 수 있습니다.</p><div style="margin-top:17px"><span class="tag gray">실제 데이터 연동 전 시안</span></div></div><div class="detailActions"><button class="btn" onclick="state.detail=null;renderDetail()">닫기</button><button class="btn primary" onclick="toast('동작 시안입니다. 원본 데이터는 변경되지 않습니다.')">관련 화면 열기 ${i('arrow','sm')}</button></div>`}
function openSearch(){const all=[{label:'워크스페이스 홈',app:'portal',page:'home',icon:'home'},...appOrder.map(id=>({label:label(id),app:id,page:apps[id].home,icon:apps[id].icon})),{label:'전체 협업 관리 · FeedbackOps',app:'hub',page:'home',icon:'feedback'},...appOrder.flatMap(id=>apps[id].groups.flatMap(group=>group.items.map(m=>({label:m[1],app:id,page:m[0],icon:m[2]})))).concat(appOrder.flatMap(id=>[['fb-voc','VOC 관리'],['fb-task','Task 관리'],['fb-survey','설문·결과']].map(m=>({label:m[1],app:id,page:m[0],icon:'feedback'}))))];let html=`<div class="psearchOverlay" onclick="if(event.target===this)closeOverlays()"><div class="psearch"><div class="psearchField">${i('search','lg')}<input id="paletteInput" placeholder="워크스페이스 또는 메뉴 이름 검색…" oninput="updateSearch(this.value)" autocomplete="off" /><button class="quietButton" onclick="closeOverlays()">Esc</button></div><div id="paletteResults" class="psearchList"></div><div class="psearchFoot">각 메뉴는 해당 시스템 워크스페이스에서 열립니다. · Enter 대신 항목을 클릭하세요.</div></div></div>`;document.getElementById('overlay').innerHTML=html;window.__allMenuEntries=all;updateSearch('');document.getElementById('paletteInput').focus()}
function updateSearch(q){const entries=(window.__allMenuEntries||[]).filter(item=>(item.label+' '+label(item.app)).toLowerCase().includes(q.toLowerCase())).slice(0,20);document.getElementById('paletteResults').innerHTML=entries.length?entries.map(x=>`<button class="cmdrow" onclick="navigate('${x.app}','${x.page}')">${i(x.icon)}<span>${x.label}</span><small>${x.app==='portal'?'홈':x.app==='hub'?'전체 협업':label(x.app)}</small>${i('chevron','sm')}</button>`).join(''):'<p style="padding:20px;color:#8391a5;text-align:center">일치하는 메뉴가 없습니다.</p>'}
function openAppPicker(){const h=`<div class="psearchOverlay" onclick="if(event.target===this)closeOverlays()"><div class="psearch" style="max-width:460px"><div class="modalHeader"><strong>워크스페이스 전환</strong><button class="quietButton" onclick="closeOverlays()">${i('close')}</button></div><div class="psearchList">${[['portal','워크스페이스 홈','home'],...appOrder.map(id=>[id,label(id),apps[id].icon]),['hub','전체 협업 관리','feedback']].map(([id,name,ic])=>`<button class="cmdrow" onclick="navigate('${id}')">${i(ic)}<span>${name}</span>${i('chevron','sm')}</button>`).join('')}</div></div></div>`;document.getElementById('overlay').innerHTML=h}
function openCreate(kind){state.dialog={kind,app:state.app};const type=kind==='voc'?'VOC':'Task';document.getElementById('overlay').innerHTML=`<div class="modalOverlay" onclick="if(event.target===this)closeOverlays()"><div class="modal"><div class="modalHeader"><span class="fbMark">F</span><strong>${label(state.app)} · ${type} 등록</strong><button class="quietButton" onclick="closeOverlays()">${i('close')}</button></div><div class="modalContent"><div class="fbBanner" style="margin-bottom:17px">${i('shield','sm')} 이 ${type}는 <strong>${label(state.app)}</strong> 시스템에만 등록됩니다.</div><div class="formGroup"><div class="formLabel">제목</div><input class="formInput" id="createTitle" placeholder="${type} 제목을 입력하세요" maxlength="90"/></div><div class="formGroup"><div class="formLabel">대상 시스템</div><input class="formInput" value="${label(state.app)}" disabled/></div><p class="pageDesc">브라우저에만 임시 추가하는 UI 시안입니다. 서버에는 저장되지 않습니다.</p></div><div class="modalFoot"><button class="btn" onclick="closeOverlays()">취소</button><button class="btn primary" onclick="createItem()">${type} 추가</button></div></div></div>`;document.getElementById('createTitle').focus()}
function createItem(){let title=document.getElementById('createTitle')?.value?.trim();if(!title){toast('제목을 입력하세요.');return}const {kind,app}=state.dialog;state.created[app]??={};state.created[app][kind]??=[];const id=kind==='voc'?'VOC-DEMO':'TASK-DEMO';state.created[app][kind].unshift([id+'-'+String(state.created[app][kind].length+1).padStart(2,'0'),title,kind==='voc'?'접수됨':'계획',kind==='voc'?'보통':'담당 미정',kind==='voc'?'미배정':'미정',...(kind==='voc'?['방금 전']:[])]);apps[app].feedback[kind]++;state.dialog=null;closeOverlays();render();toast(`${label(app)} ${kind==='voc'?'VOC':'Task'}에 시안 항목을 추가했습니다.`)}
function downloadReview(){const rows=[['결함 ID','모델','검증 Round','검토 내용','요청 조치'],['DEF-301','CVD-300','04','Process End Event 누락','로그 수정 요청'],['DEF-302','CVD-300','04','Pairing 오류 발생','재검증 샘플 제출'],['DEF-303','CVD-300','04','형식 미준수','스펙 확인 요청']];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CVD-300_협력사_검토_예시.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('검토 결과 예시 CSV가 생성되었습니다.')}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeOverlays();if(state.detail){state.detail=null;renderDetail()}}});render();
</script>
</body></html>
